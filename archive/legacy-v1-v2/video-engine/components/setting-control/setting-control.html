<!DOCTYPE html>
<!--
  setting-control -- HyperFrames sub-composition (software mockup)

  A single settings row -- label + description + a toggle/switch -- under a
  panel title, sized to fill the frame (this is intentionally a LOW
  element-count component: one row, made large and deliberate rather than
  a small cluster in empty space, per the README's frame-filling rule). The
  switch flips from `initial_state` to its opposite at `toggle_at`.

  MULTI-INSTANCE PATTERN (see ../README.md): one fixed literal
  data-composition-id/timeline key ("setting-control"). Every per-instance
  difference comes through data-composition-variables, resolved via
  lib/props.js.

  Variables:
    - panel_title  (string): header above the settings row.
    - label        (string): the setting's name.
    - description  (string): the setting's helper text, up to 2 lines.
    - initial_state(boolean): whether the switch starts on or off.
    - accent       (enum): switch "on" color. Opt-in only.
    - toggle_at    (number, seconds): when the switch flips.
    - duration     (number, seconds): total instance length.

  Registers window.__timelines["setting-control"] under the literal key.
-->
<html lang="en" data-composition-id="setting-control" data-composition-duration="5" data-composition-variables="[
    { &quot;id&quot;: &quot;panel_title&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Panel title&quot;, &quot;description&quot;: &quot;Header above the settings row.&quot;, &quot;default&quot;: &quot;Settings&quot; },
    { &quot;id&quot;: &quot;label&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Label&quot;, &quot;description&quot;: &quot;The setting's name.&quot;, &quot;default&quot;: &quot;Push notifications&quot; },
    { &quot;id&quot;: &quot;description&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Description&quot;, &quot;description&quot;: &quot;Helper text under the label, up to 2 lines.&quot;, &quot;default&quot;: &quot;Get notified about mentions, replies, and direct messages.&quot; },
    { &quot;id&quot;: &quot;initial_state&quot;, &quot;type&quot;: &quot;boolean&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Initial state&quot;, &quot;description&quot;: &quot;Whether the switch starts on or off.&quot;, &quot;default&quot;: false },
    { &quot;id&quot;: &quot;accent&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Accent&quot;, &quot;description&quot;: &quot;Switch \&quot;on\&quot; color. Opt-in only; default is the fixed brand accent.&quot;, &quot;default&quot;: &quot;brand&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;brand&quot;, &quot;label&quot;: &quot;Brand&quot; }, { &quot;value&quot;: &quot;accent&quot;, &quot;label&quot;: &quot;Accent&quot; }, { &quot;value&quot;: &quot;accent-2&quot;, &quot;label&quot;: &quot;Accent 2&quot; }, { &quot;value&quot;: &quot;accent-3&quot;, &quot;label&quot;: &quot;Accent 3&quot; }, { &quot;value&quot;: &quot;accent-4&quot;, &quot;label&quot;: &quot;Accent 4&quot; }] },
    { &quot;id&quot;: &quot;toggle_at&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Toggle at&quot;, &quot;description&quot;: &quot;Seconds from mount when the switch flips.&quot;, &quot;default&quot;: 1.6, &quot;min&quot;: 0, &quot;max&quot;: 30, &quot;step&quot;: 0.05 },
    { &quot;id&quot;: &quot;duration&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Duration&quot;, &quot;description&quot;: &quot;Total seconds this instance plays.&quot;, &quot;default&quot;: 5, &quot;min&quot;: 2, &quot;max&quot;: 30, &quot;step&quot;: 0.1 }
  ]">
  <head>
    <meta charset="UTF-8">
    <title>Setting Control</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="setting-control" data-duration="5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .sc-panel {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5cqmin;
            padding: 8cqmin;
          }
          .sc-title {
            font-weight: 800;
            letter-spacing: -0.01em;
            font-size: 5cqmin;
            opacity: 0;
            transform: translateY(1.2cqmin);
            white-space: nowrap;
            overflow: hidden;
          }
          .sc-row {
            display: flex;
            align-items: center;
            gap: 4cqmin;
            background: var(--hf-surface, #16181c);
            border: 1px solid var(--hf-border, #2c2f36);
            border-radius: calc(var(--hf-radius, 16px) * 1.1);
            padding: 6cqmin;
            opacity: 0;
            transform: translateY(1.2cqmin);
          }
          .sc-text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1.6cqmin;
          }
          .sc-label {
            font-weight: 700;
            font-size: 4.2cqmin;
            white-space: nowrap;
            overflow: hidden;
          }
          .sc-desc {
            font-size: 2.9cqmin;
            line-height: 1.35;
            color: var(--hf-muted, #9aa1ad);
          }
          .sc-switch {
            flex: 0 0 auto;
            width: 15cqmin;
            height: 8cqmin;
            border-radius: 999px;
            background: var(--hf-surface-2, #1e2126);
            border: 1px solid var(--hf-border, #2c2f36);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
          }
          .sc-switch.sc-on {
            background: var(--sc-accent, var(--hf-brand, #6ea8fe));
            border-color: var(--sc-accent, var(--hf-brand, #6ea8fe));
          }
          .sc-knob {
            position: absolute;
            top: 0.9cqmin;
            left: 0.9cqmin;
            width: 6cqmin;
            height: 6cqmin;
            border-radius: 50%;
            background: #f4f5f7;
            box-shadow: 0 0.4cqmin 1cqmin rgba(0, 0, 0, 0.4);
          }
        </style>

        <div class="sc-panel" id="sc-panel">
          <div class="sc-title" id="sc-title"></div>
          <div class="sc-row" id="sc-row">
            <div class="sc-text">
              <div class="sc-label" id="sc-label"></div>
              <div class="sc-desc" id="sc-desc"></div>
            </div>
            <div class="sc-switch" id="sc-switch">
              <div class="sc-knob" id="sc-knob"></div>
            </div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "setting-control: HFTextFit/HFProps not found on window. " +
                  "The host page must load compositions/components/lib/text-fit.js " +
                  "and lib/props.js before mounting this composition."
              );
            }

            var SCHEMA = {
              panel_title: { type: "string", default: "Settings", maxLength: 40 },
              label: { type: "string", default: "Push notifications", maxLength: 60 },
              description: {
                type: "string",
                default: "Get notified about mentions, replies, and direct messages.",
                maxLength: 160,
              },
              initial_state: { type: "boolean", default: false },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              toggle_at: { type: "number", default: 1.6, min: 0, max: 30 },
              duration: { type: "number", default: 5, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var titleEl = document.getElementById("sc-title");
            var row = document.getElementById("sc-row");
            var labelEl = document.getElementById("sc-label");
            var descEl = document.getElementById("sc-desc");
            var switchEl = document.getElementById("sc-switch");
            var knob = document.getElementById("sc-knob");

            root.style.setProperty("--sc-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            function setSwitchState(on) {
              switchEl.className = "sc-switch" + (on ? " sc-on" : "");
              var travel = switchEl.clientWidth - knob.clientWidth - 2 * 0.9 * (root.clientWidth / 100);
              gsap.set(knob, { x: on ? Math.max(0, travel) : 0 });
            }

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              HFTextFit.fitOrTruncate(titleEl, props.panel_title, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 800,
                maxWidth: titleEl.parentElement.getBoundingClientRect().width * 0.84,
                maxHeight: 1000,
                baseSize: 5 * rootMin,
                minSize: 20,
                maxLines: 1,
              });
              HFTextFit.fitOrTruncate(labelEl, props.label, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 700,
                maxWidth: labelEl.getBoundingClientRect().width || 400,
                maxHeight: 1000,
                baseSize: 4.2 * rootMin,
                minSize: 16,
                maxLines: 1,
              });
              HFTextFit.fitOrTruncate(descEl, props.description, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 400,
                maxWidth: descEl.getBoundingClientRect().width || 400,
                maxHeight: 2.9 * rootMin * 1.35 * 2,
                baseSize: 2.9 * rootMin,
                minSize: 13,
                maxLines: 2,
              });
              setSwitchState(props.initial_state);
            }
            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var toggleAt = Math.min(props.toggle_at, Math.max(0, duration - 0.3));

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(titleEl, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.15);
            tl.fromTo(row, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.35);

            var travel = function () {
              return switchEl.clientWidth - knob.clientWidth - 2 * 0.9 * (root.clientWidth / 100);
            };
            var startOn = props.initial_state;
            tl.call(
              function () {
                switchEl.classList.toggle("sc-on", !startOn);
              },
              null,
              toggleAt
            );
            tl.to(
              knob,
              {
                x: function () {
                  return startOn ? 0 : Math.max(0, travel());
                },
                duration: 0.3,
                ease: "power2.inOut",
              },
              toggleAt
            );

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["setting-control"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
