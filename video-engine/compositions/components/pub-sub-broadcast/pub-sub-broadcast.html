<!doctype html>
<!--
  pub-sub-broadcast -- HyperFrames sub-composition (Architecture)

  A publisher node at the top broadcasting a message to N subscriber nodes
  along the bottom via a message bus: dashed connector lines are drawn
  once from real measured box positions (client-server-exchange.html's
  own pattern), then a small pulse dot per subscriber travels along its
  own line, staggered, while the publisher itself pulses at publish_at and
  each subscriber flashes/highlights the instant its dot arrives.

  Subscriber boxes are built ONCE via HFProps.rebuild from the resolved
  `subscribers` list, and connector/dot positions are measured ONCE from
  real layout via getBoundingClientRect AFTER that build -- never
  recomputed after the timeline exists (client-server-exchange.html's own
  documented rationale: a later document.fonts.ready refit only ever
  touches font-size, never invalidates an already-baked travel position).

  Per-subscriber color rotation (added in the aesthetic-plan pass): each
  subscriber -- the actual per-item content list -- gets its own pulse-dot
  color and its own permanent arrival-flash border color, cycling through
  --hf-accent, -2, -3, -4, then --hf-brand by subscriber index, via a NEW
  --psb-dot-accent custom property set once per dot at measure time
  (mini-legend.html's/kpi-cluster.html's established pattern). The
  existing `accent` prop is KEPT: it still legitimately controls the
  single publisher node (border + its own dot), a single fixed source, not
  part of the per-subscriber content list.

  MULTI-INSTANCE PATTERN: one fixed literal id ("pub-sub-broadcast"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="pub-sub-broadcast"
  data-composition-duration="7"
  data-composition-variables='[
    { "id": "publisher_label", "type": "string", "role": "content", "label": "Publisher label", "description": "Label on the publisher node.", "default": "New Order Event" },
    { "id": "subscribers", "type": "string", "role": "content", "label": "Subscribers", "description": "Pipe-separated subscriber labels, 2-4, e.g. \"Email Service|Inventory Service|Analytics\". Also accepts a JSON array string.", "default": "Email Service|Inventory Service|Analytics" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Publisher border + pulse-dot color. Opt-in only; default is the fixed brand accent.", "default": "brand", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "publish_at", "type": "number", "role": "timing", "label": "Publish at", "description": "Seconds from mount when the publisher pulses and dots start fanning out.", "default": 1, "min": 0, "max": 30, "step": 0.05 },
    { "id": "fan_stagger", "type": "number", "role": "timing", "label": "Fan stagger", "description": "Seconds between successive subscriber dots departing.", "default": 0.3, "min": 0.05, "max": 2, "step": 0.05 },
    { "id": "travel_duration", "type": "number", "role": "timing", "label": "Travel duration", "description": "Seconds each dot takes to travel from publisher to subscriber.", "default": 0.9, "min": 0.2, "max": 3, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 7, "min": 2, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Pub/Sub Broadcast</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="pub-sub-broadcast" data-duration="7" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .psb-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8cqmin 6cqmin;
          }
          .psb-publisher-row {
            display: flex;
            justify-content: center;
            z-index: 2;
          }
          .psb-publisher {
            position: relative;
            display: flex;
            align-items: center;
            gap: 2cqmin;
            padding: 3.2cqmin 5cqmin;
            border-radius: 2cqmin;
            border: 0.32cqmin solid var(--psb-accent, var(--hf-brand, #6ea8fe));
            background: var(--hf-surface, #16181c);
            opacity: 0;
            transform: translateY(-1.6cqmin);
          }
          .psb-publisher-dot {
            width: 2.2cqmin;
            height: 2.2cqmin;
            min-width: 8px;
            min-height: 8px;
            border-radius: 50%;
            background: var(--psb-accent, var(--hf-brand, #6ea8fe));
            flex: 0 0 auto;
          }
          .psb-publisher-label {
            font-weight: 800;
            font-size: 3.6cqmin;
            white-space: nowrap;
            overflow: hidden;
          }
          .psb-subscribers {
            display: flex;
            justify-content: center;
            gap: 4cqmin;
            z-index: 2;
          }
          .psb-sub {
            position: relative;
            flex: 1 1 0;
            max-width: 32cqmin;
            min-width: 20cqmin;
            border-radius: 1.8cqmin;
            border: 0.26cqmin solid var(--hf-border, #2c2f36);
            background: var(--hf-surface, #16181c);
            padding: 3cqmin 2.4cqmin;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4cqmin;
            opacity: 0;
            transform: translateY(1.6cqmin);
            transition: border-color 0.2s;
          }
          .psb-sub-icon {
            width: 6.4cqmin;
            height: 6.4cqmin;
            min-width: 22px;
            min-height: 22px;
            border-radius: 1.2cqmin;
            background: var(--hf-border, #2c2f36);
          }
          .psb-sub-label {
            font-weight: 600;
            font-size: 2.6cqmin;
            color: var(--hf-muted, #9aa1ad);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
          }
          .psb-lines {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
          }
          .psb-dot {
            position: absolute;
            width: 1.8cqmin;
            height: 1.8cqmin;
            min-width: 7px;
            min-height: 7px;
            border-radius: 50%;
            background: var(--psb-dot-accent, var(--psb-accent, var(--hf-brand, #6ea8fe)));
            box-shadow: 0 0 1.4cqmin var(--psb-dot-accent, var(--psb-accent, var(--hf-brand, #6ea8fe)));
            opacity: 0;
            z-index: 3;
            transform: translate(-50%, -50%);
          }
        </style>

        <div class="psb-stage" id="psb-stage">
          <div class="psb-publisher-row">
            <div class="psb-publisher" id="psb-publisher">
              <div class="psb-publisher-dot"></div>
              <div class="psb-publisher-label" id="psb-publisher-label"></div>
            </div>
          </div>
          <svg class="psb-lines" id="psb-lines"></svg>
          <div class="psb-subscribers" id="psb-subscribers"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "pub-sub-broadcast: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SVG_NS = "http://www.w3.org/2000/svg";

            var SCHEMA = {
              publisher_label: { type: "string", default: "New Order Event", maxLength: 40 },
              subscribers: {
                type: "list",
                default: ["Email Service", "Inventory Service", "Analytics"],
                max: 4,
                delimiter: "|",
              },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              publish_at: { type: "number", default: 1, min: 0, max: 30 },
              fan_stagger: { type: "number", default: 0.3, min: 0.05, max: 2 },
              travel_duration: { type: "number", default: 0.9, min: 0.2, max: 3 },
              duration: { type: "number", default: 7, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var stage = document.getElementById("psb-stage");
            var publisher = document.getElementById("psb-publisher");
            var publisherLabel = document.getElementById("psb-publisher-label");
            var subscribersWrap = document.getElementById("psb-subscribers");
            var linesSvg = document.getElementById("psb-lines");

            root.style.setProperty("--psb-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            // Per-subscriber rotation, matching mini-legend.html/kpi-cluster.html
            // exactly -- real hex fallbacks (not bare var() refs) so this still
            // renders correctly in isolation. Separate from the `accent` prop
            // above, which stays scoped to the single publisher node.
            var SUB_ACCENT_ROTATION = [
              "var(--hf-accent, #71f5a7)",
              "var(--hf-accent-2, #c5a3ff)",
              "var(--hf-accent-3, #ffb84d)",
              "var(--hf-accent-4, #ff6e6e)",
              "var(--hf-brand, #6ea8fe)",
            ];

            var subs = props.subscribers.slice(0, 4);
            if (subs.length < 2) subs = SCHEMA.subscribers.default.slice();

            // Frame-filling: fewer subscribers -> bigger boxes/type.
            var count = subs.length;
            var labelSizeCqmin = count <= 2 ? 3.2 : count === 3 ? 2.8 : 2.4;

            var subEls = [];
            HFProps.rebuild(subscribersWrap, function (container) {
              subEls = [];
              subs.forEach(function (text) {
                var box = document.createElement("div");
                box.className = "psb-sub";
                var icon = document.createElement("div");
                icon.className = "psb-sub-icon";
                var labelEl = document.createElement("div");
                labelEl.className = "psb-sub-label";
                labelEl.style.fontSize = labelSizeCqmin + "cqmin";
                box.appendChild(icon);
                box.appendChild(labelEl);
                container.appendChild(box);
                subEls.push({ el: box, label: labelEl, text: text });
              });
            });

            function fitLabels() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              HFTextFit.fitOrTruncate(publisherLabel, props.publisher_label, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 800,
                maxWidth: 44 * rootMin,
                maxHeight: 1000,
                baseSize: 3.6 * rootMin,
                minSize: 14,
                maxLines: 1,
              });
              subEls.forEach(function (sub) {
                HFTextFit.fitOrTruncate(sub.label, sub.text, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 600,
                  maxWidth: sub.el.clientWidth - 7 * rootMin || 150,
                  maxHeight: 1000,
                  baseSize: labelSizeCqmin * rootMin,
                  minSize: 11,
                  maxLines: 1,
                });
              });
            }

            fitLabels();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(fitLabels);
            }

            // Measure ONCE from real layout, positions relative to #root.
            var rootRect = root.getBoundingClientRect();
            function centerOf(el) {
              var r = el.getBoundingClientRect();
              return {
                x: r.left + r.width / 2 - rootRect.left,
                y: r.top + r.height / 2 - rootRect.top,
              };
            }

            var pubCenter = centerOf(publisher);
            pubCenter.y = publisher.getBoundingClientRect().bottom - rootRect.top;

            var lines = [];
            var dots = [];
            subEls.forEach(function (sub, i) {
              var subRect = sub.el.getBoundingClientRect();
              var end = { x: subRect.left + subRect.width / 2 - rootRect.left, y: subRect.top - rootRect.top };

              var line = document.createElementNS(SVG_NS, "line");
              line.setAttribute("x1", pubCenter.x);
              line.setAttribute("y1", pubCenter.y);
              line.setAttribute("x2", end.x);
              line.setAttribute("y2", end.y);
              line.setAttribute("stroke", "var(--hf-border, #2c2f36)");
              line.setAttribute("stroke-width", "2");
              line.setAttribute("stroke-dasharray", "6 6");
              linesSvg.appendChild(line);
              lines.push(line);

              var dot = document.createElement("div");
              dot.className = "psb-dot";
              dot.style.left = pubCenter.x + "px";
              dot.style.top = pubCenter.y + "px";
              dot.style.setProperty("--psb-dot-accent", SUB_ACCENT_ROTATION[i % SUB_ACCENT_ROTATION.length]);
              stage.appendChild(dot);
              dots.push({ el: dot, start: pubCenter, end: end, sub: sub, accent: SUB_ACCENT_ROTATION[i % SUB_ACCENT_ROTATION.length] });
            });

            var duration = props.duration;
            var publishAt = Math.min(props.publish_at, Math.max(0, duration - 1));
            var stagger = props.fan_stagger;
            var travelDur = Math.min(props.travel_duration, Math.max(0.15, duration - publishAt - 0.2));

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(publisher, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
            subEls.forEach(function (sub, i) {
              tl.fromTo(
                sub.el,
                { opacity: 0, y: 16 },
                { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
                0.2 + i * 0.08
              );
            });

            // Publisher pulse at publish_at.
            tl.to(publisher, { scale: 1.06, duration: 0.16, ease: "power1.out" }, publishAt);
            tl.to(publisher, { scale: 1, duration: 0.22, ease: "power1.in" }, publishAt + 0.16);

            dots.forEach(function (d, i) {
              var depart = Math.min(publishAt + i * stagger, Math.max(0, duration - travelDur - 0.15));
              var arrive = depart + travelDur;
              tl.set(d.el, { left: d.start.x, top: d.start.y, opacity: 0 }, Math.max(0, depart - 0.01));
              tl.to(d.el, { opacity: 1, duration: 0.12, ease: "power1.out" }, depart);
              tl.to(d.el, { left: d.end.x, top: d.end.y, duration: travelDur, ease: "power1.inOut" }, depart);
              tl.to(d.el, { opacity: 0, duration: 0.2, ease: "power1.in" }, arrive - 0.05);
              tl.to(
                d.sub.el,
                { borderColor: d.accent, scale: 1.05, duration: 0.15, ease: "power1.out" },
                arrive
              );
              tl.to(
                d.sub.el,
                { scale: 1, duration: 0.25, ease: "power1.in" },
                arrive + 0.15
              );
            });

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["pub-sub-broadcast"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
