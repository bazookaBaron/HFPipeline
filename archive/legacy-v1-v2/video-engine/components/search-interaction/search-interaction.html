<!DOCTYPE html>
<!--
  search-interaction -- HyperFrames sub-composition (software mockup)

  A search box that types a query character-by-character, then reveals
  result rows underneath. Mirrors browser-window's URL-typing tween but for
  a search field, followed by a content-panel-style staggered list reveal.

  MULTI-INSTANCE PATTERN (see ../README.md): one fixed literal
  data-composition-id/timeline key ("search-interaction"). Every
  per-instance difference comes through data-composition-variables,
  resolved via lib/props.js.

  Variables:
    - placeholder  (string): label shown above the search field.
    - query        (string): text typed into the search field.
    - results      (list): pipe-separated result row titles.
    - accent       (enum): caret + active search-bar border color only
                   (chrome, not per-item). Opt-in only. Each result row's
                   icon instead rotates through the content-distinguishing
                   accent tokens (accent/accent-2/accent-3/accent-4/brand)
                   -- see RESULT_ROTATION in the script below, same
                   sanctioned per-item pattern as mini-legend.html.
    - type_at      (number, seconds): when query typing starts.
    - type_duration(number, seconds): how long typing takes.
    - results_at   (number, seconds): when results start revealing.
    - result_stagger (number, seconds): gap between successive result reveals.
    - duration     (number, seconds): total instance length.

  Registers window.__timelines["search-interaction"] under the literal key.
-->
<html lang="en" data-composition-id="search-interaction" data-composition-duration="6" data-composition-variables="[
    { &quot;id&quot;: &quot;placeholder&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Placeholder&quot;, &quot;description&quot;: &quot;Label shown above the search field.&quot;, &quot;default&quot;: &quot;Search&quot; },
    { &quot;id&quot;: &quot;query&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Query&quot;, &quot;description&quot;: &quot;Text typed into the search field.&quot;, &quot;default&quot;: &quot;dashboard metrics&quot; },
    { &quot;id&quot;: &quot;results&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Results&quot;, &quot;description&quot;: &quot;Pipe-separated result row titles.&quot;, &quot;default&quot;: &quot;Weekly active users|Revenue by cohort|Churn risk score&quot; },
    { &quot;id&quot;: &quot;accent&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Accent&quot;, &quot;description&quot;: &quot;Caret + active search-bar border color only (chrome, not per-item -- each result row rotates its own icon color instead). Opt-in only; default is the fixed brand accent.&quot;, &quot;default&quot;: &quot;brand&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;brand&quot;, &quot;label&quot;: &quot;Brand&quot; }, { &quot;value&quot;: &quot;accent&quot;, &quot;label&quot;: &quot;Accent&quot; }, { &quot;value&quot;: &quot;accent-2&quot;, &quot;label&quot;: &quot;Accent 2&quot; }, { &quot;value&quot;: &quot;accent-3&quot;, &quot;label&quot;: &quot;Accent 3&quot; }, { &quot;value&quot;: &quot;accent-4&quot;, &quot;label&quot;: &quot;Accent 4&quot; }] },
    { &quot;id&quot;: &quot;type_at&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Type at&quot;, &quot;description&quot;: &quot;Seconds from mount when query typing starts.&quot;, &quot;default&quot;: 0.4, &quot;min&quot;: 0, &quot;max&quot;: 30, &quot;step&quot;: 0.05 },
    { &quot;id&quot;: &quot;type_duration&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Type duration&quot;, &quot;description&quot;: &quot;Seconds the typing animation takes.&quot;, &quot;default&quot;: 1.4, &quot;min&quot;: 0.3, &quot;max&quot;: 8, &quot;step&quot;: 0.05 },
    { &quot;id&quot;: &quot;results_at&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Results at&quot;, &quot;description&quot;: &quot;Seconds from mount when results start revealing.&quot;, &quot;default&quot;: 2.1, &quot;min&quot;: 0, &quot;max&quot;: 30, &quot;step&quot;: 0.05 },
    { &quot;id&quot;: &quot;result_stagger&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Result stagger&quot;, &quot;description&quot;: &quot;Seconds between successive result reveals.&quot;, &quot;default&quot;: 0.3, &quot;min&quot;: 0.05, &quot;max&quot;: 2, &quot;step&quot;: 0.01 },
    { &quot;id&quot;: &quot;duration&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Duration&quot;, &quot;description&quot;: &quot;Total seconds this instance plays.&quot;, &quot;default&quot;: 6, &quot;min&quot;: 2, &quot;max&quot;: 30, &quot;step&quot;: 0.1 }
  ]">
  <head>
    <meta charset="UTF-8">
    <title>Search Interaction</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="search-interaction" data-duration="6" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .si-panel {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            flex-direction: column;
            padding: 8cqmin;
            gap: 4cqmin;
            justify-content: center;
          }
          .si-label {
            font-size: 3cqmin;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--hf-muted, #9aa1ad);
          }
          .si-searchbar {
            display: flex;
            align-items: center;
            gap: 2.6cqmin;
            background: var(--hf-surface, #16181c);
            border: 1px solid var(--hf-border, #2c2f36);
            border-radius: 999px;
            padding: 3cqmin 4.4cqmin;
            transition: border-color 0.2s;
          }
          .si-searchbar.si-active {
            border-color: var(--si-accent, var(--hf-brand, #6ea8fe));
          }
          .si-icon {
            flex: 0 0 auto;
            width: 4cqmin;
            height: 4cqmin;
            border: 0.5cqmin solid var(--hf-muted, #9aa1ad);
            border-radius: 50%;
            position: relative;
          }
          .si-icon::after {
            content: "";
            position: absolute;
            width: 1.8cqmin;
            height: 0.5cqmin;
            background: var(--hf-muted, #9aa1ad);
            border-radius: 1px;
            right: -1.6cqmin;
            bottom: -0.6cqmin;
            transform: rotate(45deg);
          }
          .si-query-text {
            flex: 1;
            min-width: 0;
            font-size: 3.6cqmin;
            color: var(--hf-fg, #f4f5f7);
            white-space: nowrap;
            overflow: hidden;
          }
          .si-caret {
            display: inline-block;
            width: 0.4cqmin;
            height: 3.4cqmin;
            background: var(--si-accent, var(--hf-brand, #6ea8fe));
            vertical-align: -0.6cqmin;
            margin-left: 0.3cqmin;
          }
          .si-results {
            display: flex;
            flex-direction: column;
            gap: 2.2cqmin;
          }
          .si-result {
            display: flex;
            align-items: center;
            gap: 2.8cqmin;
            background: var(--hf-surface, #16181c);
            border: 1px solid var(--hf-border, #2c2f36);
            border-radius: var(--hf-radius-sm, 10px);
            padding: 2.6cqmin 3.4cqmin;
            opacity: 0;
            transform: translateY(1.4cqmin);
          }
          .si-result-icon {
            flex: 0 0 auto;
            width: 3.4cqmin;
            height: 3.4cqmin;
            border-radius: 0.8cqmin;
            /* Background is set per-row in JS from RESULT_ROTATION -- this
               is only a defensive fallback in case JS hasn't run yet. */
            background: var(--hf-muted, #9aa1ad);
            opacity: 0.85;
          }
          .si-result-text {
            flex: 1;
            min-width: 0;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
          }
        </style>

        <div class="si-panel" id="si-panel">
          <div class="si-label" id="si-label"></div>
          <div class="si-searchbar" id="si-searchbar">
            <div class="si-icon" aria-hidden="true"></div>
            <span class="si-query-text" id="si-query-text"></span><span class="si-caret" id="si-caret"></span>
          </div>
          <div class="si-results" id="si-results"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "search-interaction: HFTextFit/HFProps not found on window. " +
                  "The host page must load compositions/components/lib/text-fit.js " +
                  "and lib/props.js before mounting this composition."
              );
            }

            var SCHEMA = {
              placeholder: { type: "string", default: "Search", maxLength: 40 },
              query: { type: "string", default: "dashboard metrics", maxLength: 60 },
              results: {
                type: "list",
                default: ["Weekly active users", "Revenue by cohort", "Churn risk score"],
                max: 6,
                delimiter: "|",
              },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              type_at: { type: "number", default: 0.4, min: 0, max: 30 },
              type_duration: { type: "number", default: 1.4, min: 0.3, max: 8 },
              results_at: { type: "number", default: 2.1, min: 0, max: 30 },
              result_stagger: { type: "number", default: 0.3, min: 0.05, max: 2 },
              duration: { type: "number", default: 6, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var label = document.getElementById("si-label");
            var searchbar = document.getElementById("si-searchbar");
            var queryText = document.getElementById("si-query-text");
            var resultsWrap = document.getElementById("si-results");

            root.style.setProperty("--si-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");
            label.textContent = props.placeholder;

            // Frame-filling: fewer results -> larger row type + more gap
            // (README hard rule).
            var count = Math.max(1, props.results.length);
            var resultFontCqmin = count <= 2 ? 4.2 : count <= 4 ? 3.4 : 2.8;
            resultsWrap.style.gap = (count <= 2 ? 3.6 : count <= 4 ? 2.6 : 2) + "cqmin";

            // Per-result accent rotation -- each result row is a distinct
            // content item (the sanctioned per-item use case; see
            // mini-legend.html's SWATCH_ROTATION). The `--si-accent` var
            // above (still driven by the `accent` prop) stays reserved for
            // the caret + active search-bar border, which are not
            // per-item elements.
            var RESULT_ROTATION = [
              "var(--hf-accent, #71f5a7)",
              "var(--hf-accent-2, #c5a3ff)",
              "var(--hf-accent-3, #ffb84d)",
              "var(--hf-accent-4, #ff6e6e)",
              "var(--hf-brand, #6ea8fe)",
            ];

            var resultEls = [];
            HFProps.rebuild(resultsWrap, function (container) {
              resultEls = [];
              props.results.forEach(function (text, i) {
                var row = document.createElement("div");
                row.className = "si-result";
                var icon = document.createElement("div");
                icon.className = "si-result-icon";
                icon.style.background = RESULT_ROTATION[i % RESULT_ROTATION.length];
                var textEl = document.createElement("span");
                textEl.className = "si-result-text";
                textEl.style.fontSize = resultFontCqmin + "cqmin";
                row.appendChild(icon);
                row.appendChild(textEl);
                container.appendChild(row);
                resultEls.push({ el: row, text: textEl, src: text });
              });
            });

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              resultEls.forEach(function (r) {
                var boxWidth = r.text.getBoundingClientRect().width || 300;
                HFTextFit.fitOrTruncate(r.text, r.src, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 500,
                  maxWidth: boxWidth,
                  maxHeight: 1000,
                  baseSize: resultFontCqmin * rootMin,
                  minSize: 14,
                  maxLines: 1,
                });
              });
            }
            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var typeStart = Math.min(props.type_at, Math.max(0, duration - 0.3));
            var typeDur = Math.min(props.type_duration, Math.max(0.2, duration - typeStart - 0.2));
            var resultsAt = Math.min(Math.max(props.results_at, typeStart + typeDur), Math.max(0, duration - 0.15));
            var stagger = props.result_stagger;

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0);
            tl.set(searchbar, { className: "si-searchbar si-active" }, typeStart);

            var proxy = { i: 0 };
            tl.to(
              proxy,
              {
                i: props.query.length,
                duration: typeDur,
                ease: "none",
                onUpdate: function () {
                  queryText.textContent = props.query.slice(0, Math.round(proxy.i));
                },
              },
              typeStart
            );
            tl.set(searchbar, { className: "si-searchbar" }, typeStart + typeDur + 0.1);

            resultEls.forEach(function (r, i) {
              var at = Math.min(resultsAt + i * stagger, Math.max(0, duration - 0.1));
              tl.fromTo(r.el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at);
            });

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["search-interaction"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
