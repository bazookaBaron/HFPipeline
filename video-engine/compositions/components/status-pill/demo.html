<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: status-pill</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <link rel="stylesheet" href="../lib/tokens.css" />
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        transform-origin: top center;
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
      #controls {
        display: flex;
        align-items: center;
      }
      button {
        background: #6ea8fe;
        color: #0b0d10;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>status-pill</h1>
    <p>
      Annotation primitive: state drives the pill's color as a semantic exemption from the opt-in
      accent rule (see file header). This instance overrides <code>state</code> (deprecated),
      <code>text</code> and position via <code>data-variable-values</code> to prove the multi-instance
      pattern.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./status-pill.html",
        mountEl: document.getElementById("stage"),
        compositionId: "status-pill",
        width: 1080,
        height: 1920,
        variables: {
          text: "Deprecated in v3",
          state: "deprecated",
          show_dot: true,
          pulse: true,
          x_pct: 62,
          y_pct: 24,
          reveal_at: 0.3,
          duration: 4,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
