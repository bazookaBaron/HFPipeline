<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: deployment-dashboard</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>deployment-dashboard</h1>
    <p>
      Mid-switch instance: a genuinely uneven 62/38 traffic split (proves the routing-switch
      lever lands off-center, not just at the tidy 50/50 or 100/0 extremes) with the 5xx
      error-rate chart showing a rising trend.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./deployment-dashboard.html",
        mountEl: document.getElementById("stage"),
        compositionId: "deployment-dashboard",
        width: 1080,
        height: 1920,
        variables: {
          leftLabel: "BLUE",
          rightLabel: "GREEN",
          leftVersion: "v1.4.2",
          rightVersion: "v2.0.1",
          leftLive: true,
          rightLive: true,
          leftInstances: [
            { id: "i-0a3f8c21", healthy: true },
            { id: "i-7b291de4", healthy: true },
            { id: "i-c48a02f1", healthy: false },
          ],
          rightInstances: [
            { id: "i-9f13aa02", healthy: true },
            { id: "i-52dd881c", healthy: true },
            { id: "i-e60347bb", healthy: true },
          ],
          leftTrafficPct: 62,
          rightTrafficPct: 38,
          showErrorChart: true,
          errorRatePct: 1.8,
          errorChartTrend: "rising",
          showUsersFunnel: false,
          listenerLabel: "listener :443  forward",
          reveal_at: 0.3,
          switch_at: 1.4,
          duration: 8,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
