<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: world-map-panel</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>world-map-panel</h1>
    <p>Eight points (the max), exercising the fullest point-list length and stagger sequencing.</p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./world-map-panel.html",
        mountEl: document.getElementById("stage"),
        compositionId: "world-map-panel",
        width: 1080,
        height: 1920,
        variables: {
          title: "Where requests land",
          points: JSON.stringify([
            { label: "Oregon", x: 14, y: 30 },
            { label: "Virginia", x: 28, y: 36 },
            { label: "Sao Paulo", x: 33, y: 68 },
            { label: "London", x: 47, y: 28 },
            { label: "Mumbai", x: 66, y: 50 },
            { label: "Singapore", x: 78, y: 58 },
            { label: "Tokyo", x: 85, y: 36 },
            { label: "Sydney", x: 87, y: 78 },
          ]),
          reveal_at: 0.3,
          point_stagger: 0.35,
          duration: 8,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
