<!doctype html>
<!--
  deployment-dashboard -- HyperFrames sub-composition (Architecture)

  ONE rich dashboard visual meant to be reused many times across a
  blue-green-deployment narrative with different data each time (traffic
  split, instance health, error rate) -- not six separate components. Real
  research (frame-by-frame reference video) found the entire ~2-minute
  narrative reuses this single visual: an ALB listener line, a routing
  switch (dot/lever sliding along a track between a BLUE and a GREEN
  anchor, positioned proportionally to the traffic split), and two
  side-by-side environment cards (version tag, LIVE/IDLE badge, 3-4
  instance rows, a big traffic percentage). An optional small red 5xx
  error-rate line chart sits above the ALB line. An optional alternate
  content mode (`showUsersFunnel`) replaces the whole LB+cards region with
  a simple "N user icons funneling into a point" visual -- the framing
  used BEFORE the two-environment view exists in the narrative.

  Card/instance rows and funnel icons are built ONCE via HFProps.rebuild
  from the resolved props before the GSAP timeline captures references to
  them -- matching kpi-cluster.html's documented ordering rule. The switch
  lever's travel range and the funnel's convergence lines are measured
  ONCE from real layout (getBoundingClientRect), baked into the timeline
  at build time -- matching client-server-exchange.html's packet and
  fan-out-fan-in.html's travel-dot discipline.

  Color discipline: BLUE/GREEN are a FIXED semantic pair (--dd-blue /
  --dd-green), not the opt-in --hf-accent* content rotation -- they depict
  a real deployment-environment identity, not a decorative color choice,
  the same documented exemption browser-window's traffic-light dots and
  status-pill's live/deprecated state colors get (see ../README.md "Color
  discipline"). Instance health (HEALTHY/IDLE) is its own separate
  semantic color (green/muted), independent of which environment the
  instance belongs to.

  MULTI-INSTANCE PATTERN: one fixed literal id ("deployment-dashboard");
  every per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="deployment-dashboard"
  data-composition-duration="8"
  data-composition-variables='[
    { "id": "leftLabel", "type": "string", "role": "content", "label": "Left env label", "description": "Left environment identity label (e.g. BLUE).", "default": "BLUE" },
    { "id": "rightLabel", "type": "string", "role": "content", "label": "Right env label", "description": "Right environment identity label (e.g. GREEN).", "default": "GREEN" },
    { "id": "leftVersion", "type": "string", "role": "content", "label": "Left version", "description": "Version tag shown on the left card.", "default": "v1.4.2" },
    { "id": "rightVersion", "type": "string", "role": "content", "label": "Right version", "description": "Version tag shown on the right card.", "default": "v2.0.1" },
    { "id": "leftLive", "type": "boolean", "role": "content", "label": "Left is live", "description": "Whether the left card shows a LIVE badge (false = IDLE).", "default": true },
    { "id": "rightLive", "type": "boolean", "role": "content", "label": "Right is live", "description": "Whether the right card shows a LIVE badge (false = IDLE).", "default": false },
    { "id": "leftInstances", "type": "string", "role": "content", "label": "Left instances", "description": "JSON array of {id, healthy} objects, 3-4 items, for the left card.", "default": "[{\"id\":\"i-0a3f8c21\",\"healthy\":true},{\"id\":\"i-7b291de4\",\"healthy\":true},{\"id\":\"i-c48a02f1\",\"healthy\":true}]" },
    { "id": "rightInstances", "type": "string", "role": "content", "label": "Right instances", "description": "JSON array of {id, healthy} objects, 3-4 items, for the right card.", "default": "[{\"id\":\"i-9f13aa02\",\"healthy\":false},{\"id\":\"i-52dd881c\",\"healthy\":false},{\"id\":\"i-e60347bb\",\"healthy\":false}]" },
    { "id": "leftTrafficPct", "type": "number", "role": "content", "label": "Left traffic %", "description": "Percent of traffic routed to the left environment. Should sum to ~100 with rightTrafficPct.", "default": 100, "min": 0, "max": 100, "step": 1 },
    { "id": "rightTrafficPct", "type": "number", "role": "content", "label": "Right traffic %", "description": "Percent of traffic routed to the right environment. Should sum to ~100 with leftTrafficPct.", "default": 0, "min": 0, "max": 100, "step": 1 },
    { "id": "showErrorChart", "type": "boolean", "role": "content", "label": "Show error chart", "description": "Whether the small 5xx error-rate line chart shows above the ALB line.", "default": false },
    { "id": "errorRatePct", "type": "number", "role": "content", "label": "Error rate %", "description": "Current 5xx error rate percent, anchors the right-hand end of the chart.", "default": 0.4, "min": 0, "max": 100, "step": 0.01 },

    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 8, "min": 3, "max": 30, "step": 0.1 }
  ]'

              '<circle cx="12" cy="6.4" r="3.6" fill="currentColor" opacity="0.85"/>' +
              '<path d="M4.5 21.5c0-4.7 3.36-8 7.5-8s7.5 3.3 7.5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.85"/>' +

              // (thorough --at-transitions sweep): `.dd-lb-tg` (the listener's sibling
              // in the same flex row) is EMPTY at this initial layout pass -- its real
              // content is only written later, per animation frame, by the traffic-split
              // tween's onUpdate (see tgProxies below). A flat "50% of stage width" guess

                // errorRatePct:100 rendered an axis max of "130.0%"), which reads as a real
                // data value, not a scale tick -- percentages can't exceed 100. Capped at 100,
                // and rounded up to a clean increment (5/10/25/50/100) the way an axis label

                var axisMin = document.createElementNS(SVG_NS, "text");

                axisMin.setAttribute("y", chartH - 2);
                axisMin.setAttribute("class", "dd-error-axis");
                axisMin.textContent = "0%";
                errorSvg.appendChild(axisMin);

                var plotLeft = 28;
                var plotWGrid = Math.max(20, chartW - plotLeft - 4);
                // A faint gridline pattern -- real reference-video comparison found our chart
                // was a bare line with no visual scaffolding, reading as unfinished next to
                // the reference's gridded, axis-labeled charts.
                [0.5, 1].forEach(function (frac) {
                  var gy = chartH - 4 - frac * (chartH - 14);
                  var grid = document.createElementNS(SVG_NS, "line");
                  grid.setAttribute("x1", plotLeft);
                  grid.setAttribute("y1", gy);
                  grid.setAttribute("x2", plotLeft + plotWGrid);
                  grid.setAttribute("y2", gy);
                  grid.setAttribute("stroke", "var(--hf-border, #2c2f36)");
                  grid.setAttribute("stroke-width", "1");
                  grid.setAttribute("stroke-dasharray", "2,3");
                  errorSvg.appendChild(grid);
                });
                var plotW = Math.max(20, chartW - plotLeft - 4);
                var pts = values.map(function (v, i) {
                  var x = plotLeft + (i / (values.length - 1)) * plotW;
                  var y = chartH - 4 - (v / maxVal) * (chartH - 14);
                  return x + "," + y;
                });

                var poly = document.createElementNS(SVG_NS, "polyline");
                poly.setAttribute("points", pts.join(" "));
                poly.setAttribute("fill", "none");
                poly.setAttribute("stroke", "var(--hf-accent-4, #ff6e6e)");
                poly.setAttribute("stroke-width", "2.5");
                poly.setAttribute("stroke-linejoin", "round");
                poly.setAttribute("stroke-linecap", "round");
                errorSvg.appendChild(poly);

                var len = poly.getTotalLength ? poly.getTotalLength() : 400;
                poly.style.strokeDasharray = len;
                poly.style.strokeDashoffset = len;
                tl.to(poly, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, revealAt + 0.1);
                tl.fromTo(errorChart, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, revealAt);
              }
            }

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["deployment-dashboard"] = tl;
          })();
        </script>
      </div>
    </template>
