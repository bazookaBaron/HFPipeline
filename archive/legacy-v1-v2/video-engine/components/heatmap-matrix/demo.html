<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: heatmap-matrix</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>heatmap-matrix</h1>
    <p>
      Data/metrics primitive: a 5x7 heatmap grid whose cells light up in a row-major staggered
      wave, intensity encoded as opacity of the one fixed brand-accent hue.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./heatmap-matrix.html",
        mountEl: document.getElementById("stage"),
        compositionId: "heatmap-matrix",
        width: 1080,
        height: 1920,
        variables: {
          label: "Errors by Endpoint / Hour",
          rows: 5,
          cols: 7,
          cells:
            "0.05,0.1,0.2,0.15,0.3,0.4,0.2,0.1,0.2,0.4,0.5,0.6,0.5,0.3,0.2,0.3,0.6,0.9,1,0.7,0.4,0.15,0.25,0.5,0.7,0.6,0.35,0.2,0.1,0.15,0.3,0.4,0.3,0.2,0.1",
          accent: "brand",
          reveal_at: 0.4,
          cell_stagger: 0.035,
          duration: 6,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
