<!doctype html>
<!--
  latency-waterfall -- HyperFrames sub-composition (Data / metrics)

  A horizontal waterfall chart: sequential timing phases (DNS, Connect,
  TLS, Wait, Download, ...) stacked left-to-right in one bar, each
  segment's width proportional to its own duration, revealing in order
  (segment N finishes growing before segment N+1 starts) so the chart
  reads like a real network waterfall. A running total updates as each
  segment completes.

  Segments are distinguished by rotating through --hf-accent, -2, -3, -4,
  then --hf-brand by index (added in the aesthetic-plan pass; was previously
  a per-index opacity ramp on one fixed hue). Real user feedback ("use more
  colors... more different colors") drove replacing the ramp with actual
  distinct colors per phase, matching cost-breakdown.html's donut-segment
  upgrade -- each phase (DNS/Connect/TLS/Wait/Download) is simultaneous
  chart content, exactly the sanctioned per-item use case the tokens exist
  for (see ../README.md "Color discipline"). Replaces the earlier single
  `accent` prop, which is no longer meaningful once every segment has its
  own color -- removed from this component's schema entirely rather than
  left as a vestigial no-op.

  Phases are cleared and rebuilt from props every mount (HFProps.rebuild)
  before the GSAP timeline captures references, matching kpi-cluster's
  "build once, then animate" ordering.

  MULTI-INSTANCE PATTERN: one fixed literal id ("latency-waterfall");
  every per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="latency-waterfall"
  data-composition-duration="8"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "Heading above the waterfall.", "default": "Request waterfall" },
    { "id": "phases", "type": "string", "role": "content", "label": "Phases", "description": "JSON array of {label, ms} objects, in sequential order, 2-6 items.", "default": "[{\"label\":\"DNS\",\"ms\":24},{\"label\":\"Connect\",\"ms\":38},{\"label\":\"TLS\",\"ms\":62},{\"label\":\"Wait\",\"ms\":145},{\"label\":\"Download\",\"ms\":210}]" },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Reveal at", "description": "Seconds from mount when the title and bar frame appear.", "default": 0.3, "min": 0, "max": 30, "step": 0.05 },
    { "id": "phase_duration", "type": "number", "role": "timing", "label": "Phase duration", "description": "Seconds each phase segment takes to grow before the next one starts.", "default": 0.45, "min": 0.15, "max": 2, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 8, "min": 3, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Latency Waterfall</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="latency-waterfall" data-duration="8" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .lw-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5cqmin;
            padding: 8cqmin 7cqmin;
          }
          .lw-title {
            font-weight: 800;
            letter-spacing: -0.01em;
            opacity: 0;
            transform: translateY(1.4cqmin);
            white-space: nowrap;
            overflow: hidden;
          }
          .lw-chart {
            display: flex;
            flex-direction: column;
            gap: 2.6cqmin;
          }
          .lw-bar {
            position: relative;
            width: 100%;
            height: 8cqmin;
            min-height: 28px;
            border-radius: 999px;
            background: var(--hf-surface, #16181c);
            border: 1px solid var(--hf-border, #2c2f36);
            display: flex;
            overflow: hidden;
          }
          .lw-seg {
            height: 100%;
            transform: scaleX(0);
            transform-origin: left center;
            background: var(--lw-accent, var(--hf-brand, #6ea8fe));
            border-right: 1px solid rgba(0, 0, 0, 0.28);
          }
          .lw-seg:last-child {
            border-right: none;
          }
          .lw-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1.6cqmin 3.4cqmin;
          }
          .lw-legend-item {
            display: flex;
            align-items: center;
            gap: 1.2cqmin;
            opacity: 0;
            transform: translateY(1cqmin);
          }
          .lw-swatch {
            flex: 0 0 auto;
            width: 1.9cqmin;
            height: 1.9cqmin;
            min-width: 8px;
            min-height: 8px;
            border-radius: 3px;
            background: var(--lw-accent, var(--hf-brand, #6ea8fe));
          }
          .lw-legend-label {
            font-weight: 600;
            color: var(--hf-fg, #f4f5f7);
            white-space: nowrap;
          }
          .lw-legend-ms {
            font-weight: 600;
            color: var(--hf-muted, #9aa1ad);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
          }
          .lw-total {
            display: flex;
            align-items: baseline;
            gap: 1.2cqmin;
            opacity: 0;
          }
          .lw-total-label {
            font-weight: 600;
            color: var(--hf-muted, #9aa1ad);
          }
          .lw-total-value {
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--hf-fg, #f4f5f7);
          }
        </style>

        <div class="lw-stage" id="lw-stage">
          <div class="lw-title" id="lw-title"></div>
          <div class="lw-chart">
            <div class="lw-bar" id="lw-bar"></div>
            <div class="lw-legend" id="lw-legend"></div>
          </div>
          <div class="lw-total" id="lw-total">
            <span class="lw-total-label">Total</span>
            <span class="lw-total-value" id="lw-total-value">0 ms</span>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "latency-waterfall: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var DEFAULT_PHASES = [
              { label: "DNS", ms: 24 },
              { label: "Connect", ms: 38 },
              { label: "TLS", ms: 62 },
              { label: "Wait", ms: 145 },
              { label: "Download", ms: 210 },
            ];

            var SCHEMA = {
              title: { type: "string", default: "Request waterfall", maxLength: 80 },
              phases: { type: "list", default: DEFAULT_PHASES, max: 6, delimiter: "|" },
              reveal_at: { type: "number", default: 0.3, min: 0, max: 30 },
              phase_duration: { type: "number", default: 0.45, min: 0.15, max: 2 },
              duration: { type: "number", default: 8, min: 3, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var stage = document.getElementById("lw-stage");
            var titleEl = document.getElementById("lw-title");
            var bar = document.getElementById("lw-bar");
            var legend = document.getElementById("lw-legend");
            var totalEl = document.getElementById("lw-total");
            var totalValueEl = document.getElementById("lw-total-value");

            // Normalize every phase entry independently -- never a silent
            // partial object.
            function normalizePhase(raw, i) {
              raw = raw && typeof raw === "object" ? raw : {};
              var fallback = DEFAULT_PHASES[i % DEFAULT_PHASES.length];
              var label = typeof raw.label === "string" && raw.label.trim() ? raw.label.trim() : fallback.label;
              var ms = typeof raw.ms === "number" && isFinite(raw.ms) && raw.ms > 0 ? raw.ms : fallback.ms;
              return { label: label, ms: ms };
            }

            var phases = props.phases.slice(0, 6).map(normalizePhase);
            if (phases.length < 2) {
              phases = DEFAULT_PHASES.map(normalizePhase);
            }

            var total = phases.reduce(function (sum, p) {
              return sum + p.ms;
            }, 0);

            // Per-segment rotation, matching mini-legend.html/cost-breakdown.html
            // exactly -- real hex fallbacks so this still renders correctly in
            // isolation. Replaces the earlier single-hue opacity ramp: real
            // distinct colors per latency phase (DNS/Connect/TLS/Wait/Download)
            // is exactly the sanctioned per-item use case (README "Color
            // discipline"), not a chrome-only accent.
            var ACCENT_ROTATION = [
              "var(--hf-accent, #71f5a7)",
              "var(--hf-accent-2, #c5a3ff)",
              "var(--hf-accent-3, #ffb84d)",
              "var(--hf-accent-4, #ff6e6e)",
              "var(--hf-brand, #6ea8fe)",
            ];

            var segEls = [];
            var legendEls = [];
            HFProps.rebuild(bar, function (container) {
              segEls = [];
              phases.forEach(function (phase, i) {
                var seg = document.createElement("div");
                seg.className = "lw-seg";
                seg.style.width = (phase.ms / total) * 100 + "%";
                seg.style.background = ACCENT_ROTATION[i % ACCENT_ROTATION.length];
                container.appendChild(seg);
                segEls.push(seg);
              });
            });

            HFProps.rebuild(legend, function (container) {
              legendEls = [];
              phases.forEach(function (phase, i) {
                var item = document.createElement("div");
                item.className = "lw-legend-item";
                var swatch = document.createElement("span");
                swatch.className = "lw-swatch";
                swatch.style.background = ACCENT_ROTATION[i % ACCENT_ROTATION.length];
                var labelEl = document.createElement("span");
                labelEl.className = "lw-legend-label";
                var msEl = document.createElement("span");
                msEl.className = "lw-legend-ms";
                msEl.textContent = Math.round(phase.ms) + " ms";
                item.appendChild(swatch);
                item.appendChild(labelEl);
                item.appendChild(msEl);
                container.appendChild(item);
                legendEls.push({ el: item, labelEl: labelEl, phase: phase });
              });
            });

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              var boxWidth = stage.clientWidth - stage.clientWidth * 0.14;

              HFTextFit.fitOrTruncate(titleEl, props.title, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 800,
                maxWidth: boxWidth,
                maxHeight: 1000,
                baseSize: 6.4 * rootMin,
                minSize: 18,
                maxLines: 1,
              });

              legendEls.forEach(function (item) {
                HFTextFit.fitOrTruncate(item.labelEl, item.phase.label, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 600,
                  maxWidth: Math.max(60, boxWidth * 0.3),
                  maxHeight: 1000,
                  baseSize: 2.6 * rootMin,
                  minSize: 12,
                  maxLines: 1,
                });
              });
            }

            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var revealAt = Math.min(props.reveal_at, Math.max(0, duration - 0.5));
            var phaseDur = props.phase_duration;

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(titleEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, revealAt);
            tl.fromTo(bar, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, revealAt + 0.15);

            var barsStart = revealAt + 0.4;
            segEls.forEach(function (seg, i) {
              var at = Math.min(barsStart + i * phaseDur, Math.max(0, duration - 0.3));
              tl.to(seg, { scaleX: 1, duration: Math.min(phaseDur, Math.max(0.1, duration - at - 0.1)), ease: "power2.out" }, at);
              tl.fromTo(
                legendEls[i].el,
                { opacity: 0, y: 8 },
                { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
                at
              );
            });

            var totalAt = Math.min(barsStart + phases.length * phaseDur + 0.1, Math.max(0, duration - 0.3));
            var proxy = { v: 0 };
            tl.fromTo(totalEl, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, totalAt);
            tl.to(
              proxy,
              {
                v: total,
                duration: Math.min(0.6, Math.max(0.15, duration - totalAt - 0.1)),
                ease: "power2.out",
                onUpdate: function () {
                  totalValueEl.textContent = Math.round(proxy.v) + " ms";
                },
              },
              totalAt
            );

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["latency-waterfall"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
