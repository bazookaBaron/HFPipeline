<!doctype html>
<!--
  big-stat-callout -- HyperFrames sub-composition (Data / metrics)

  A single standalone giant number + short label, no card chrome -- for a
  moment where ONE number carries the whole beat (a data size crossing a
  network hop, a request count, a latency figure), matching the "5 GB into
  the API" style callout found in this project's reference-video research
  (see repo-root VIDEO_AESTHETIC_PLAN.md "New components needed"). This is
  deliberately NOT kpi-cluster (2-4 cards): it's the single-number case
  kpi-cluster's own schema explicitly folds back to its default set for
  (`kpis.length < 2`), so a caller wanting exactly one huge number needs a
  dedicated component instead of fighting kpi-cluster's multi-card grid.

  Frame-filling: the number is sized relative to the stage, an optional
  short context line sits above it, and an optional secondary caption-style
  line sits below (e.g. "into the API") -- three stacked pieces, still
  mostly empty canvas by design (this is meant to feel like ONE huge fact,
  not a dashboard), but never LESS filled than kpi-cluster's own single-row
  case.

  MULTI-INSTANCE PATTERN: one fixed literal id ("big-stat-callout"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="big-stat-callout"
  data-composition-duration="5"
  data-composition-variables='[
    { "id": "context", "type": "string", "role": "content", "label": "Context line", "description": "Short line above the number, e.g. \"A single upload sends\".", "default": "A single upload sends" },
    { "id": "value", "type": "string", "role": "content", "label": "Value", "description": "The big number/value itself, already formatted, e.g. \"5 GB\" or \"400,000\". Never computed at render time.", "default": "5 GB" },
    { "id": "caption", "type": "string", "role": "content", "label": "Caption line", "description": "Short line below the number, e.g. \"into the API\".", "default": "into the API" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Big-value color. Opt-in only; default is the fixed brand accent.", "default": "brand", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "context_at", "type": "number", "role": "timing", "label": "Context reveal at", "description": "Seconds from mount when the context line reveals.", "default": 0.2, "min": 0, "max": 30, "step": 0.05 },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Value reveal at", "description": "Seconds from mount when the big value pops in.", "default": 0.5, "min": 0, "max": 30, "step": 0.05 },
    { "id": "caption_at", "type": "number", "role": "timing", "label": "Caption reveal at", "description": "Seconds from mount when the caption line reveals.", "default": 0.85, "min": 0, "max": 30, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 5, "min": 1.5, "max": 20, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Big Stat Callout</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="big-stat-callout" data-duration="5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .bsc-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.2cqmin;
            padding: 10cqmin;
          }
          .bsc-context {
            font-weight: 700;
            color: var(--hf-muted, #9aa1ad);
            text-align: center;
            opacity: 0;
            transform: translateY(1.2cqmin);
          }
          .bsc-value {
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--bsc-accent, var(--hf-brand, #6ea8fe));
            text-align: center;
            line-height: 1;
            opacity: 0;
            transform: scale(0.82);
          }
          .bsc-caption {
            font-weight: 600;
            color: var(--hf-fg, #f4f5f7);
            text-align: center;
            opacity: 0;
            transform: translateY(1.2cqmin);
          }
        </style>

        <div class="bsc-stage" id="bsc-stage">
          <div class="bsc-context" id="bsc-context"></div>
          <div class="bsc-value" id="bsc-value"></div>
          <div class="bsc-caption" id="bsc-caption"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "big-stat-callout: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SCHEMA = {
              context: { type: "string", default: "A single upload sends", maxLength: 60 },
              value: { type: "string", default: "5 GB", maxLength: 24 },
              caption: { type: "string", default: "into the API", maxLength: 60 },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              context_at: { type: "number", default: 0.2, min: 0, max: 30 },
              reveal_at: { type: "number", default: 0.5, min: 0, max: 30 },
              caption_at: { type: "number", default: 0.85, min: 0, max: 30 },
              duration: { type: "number", default: 5, min: 1.5, max: 20 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var stage = document.getElementById("bsc-stage");
            var contextEl = document.getElementById("bsc-context");
            var valueEl = document.getElementById("bsc-value");
            var captionEl = document.getElementById("bsc-caption");

            root.style.setProperty("--bsc-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              var boxWidth = stage.clientWidth - stage.clientWidth * 0.14;

              HFTextFit.fitOrTruncate(contextEl, props.context, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 700,
                maxWidth: boxWidth,
                maxHeight: 1000,
                baseSize: 3.6 * rootMin,
                minSize: 16,
                maxLines: 1,
              });

              // The value is the whole point of this component -- the single biggest type
              // size in this catalog after takeaway-banner, matching the reference-video
              // "one huge number" moments this component was built to reproduce.
              HFTextFit.fitOrTruncate(valueEl, props.value, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 900,
                maxWidth: boxWidth,
                maxHeight: 26 * rootMin * 1.3,
                baseSize: 22 * rootMin,
                minSize: 40,
                maxLines: 1,
              });

              HFTextFit.fitOrTruncate(captionEl, props.caption, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 600,
                maxWidth: boxWidth,
                maxHeight: 1000,
                baseSize: 3.4 * rootMin,
                minSize: 15,
                maxLines: 1,
              });
            }
            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var contextAt = Math.min(props.context_at, Math.max(0, duration - 0.6));
            var revealAt = Math.min(Math.max(props.reveal_at, contextAt + 0.15), Math.max(0, duration - 0.4));
            var captionAt = Math.min(Math.max(props.caption_at, revealAt + 0.15), Math.max(0, duration - 0.1));

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(
              contextEl,
              { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
              contextAt
            );
            tl.fromTo(
              valueEl,
              { opacity: 0, scale: 0.82 },
              { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
              revealAt
            );
            tl.fromTo(
              captionEl,
              { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
              captionAt
            );

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["big-stat-callout"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
