<!doctype html>
<!--
  queue-backpressure -- HyperFrames sub-composition (Architecture)

  A row of N queue slots fills left-to-right as items arrive one at a
  time; once every slot is occupied, a "queue full / backpressure"
  indicator lights up above the entry point and an extra item visibly
  bounces back off the full queue instead of entering -- the backpressure
  signal a producer would see.

  Color discipline / judgment call: unlike the other components in this
  pass, slots here are NOT distinct named content items (no per-slot
  labels) -- they are anonymous capacity units. Even so, each item filling
  a slot is a real, discrete arrival event in a fixed order, so it gets
  the same sanctioned per-item rotation treatment (assigned once per slot
  at build time) rather than a single static fill color -- this is what
  actually delivers "more colors" here, since the slots are the only
  visual content besides the badge. The old single `accent` prop drove
  this SAME per-slot fill/border color and nothing else, so it has been
  removed entirely. The QUEUE FULL badge and the bounced item keep their
  existing fixed semantic red (#ff6e6e) UNTOUCHED -- that is a fixed
  failure/backpressure state, not per-item content, and must not rotate
  or otherwise change (see file header "don't touch" rule in the project
  CLAUDE.md-level guidance).

  MULTI-INSTANCE PATTERN: one fixed literal id ("queue-backpressure");
  every per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="queue-backpressure"
  data-composition-duration="8"
  data-composition-variables='[
    { "id": "capacity", "type": "number", "role": "content", "label": "Capacity", "description": "Number of queue slots.", "default": 6, "min": 3, "max": 8, "step": 1 },
    { "id": "queue_label", "type": "string", "role": "content", "label": "Queue label", "description": "Label above the queue slots.", "default": "Message Queue" },
    { "id": "start_at", "type": "number", "role": "timing", "label": "Start at", "description": "Seconds from mount when items begin arriving.", "default": 0.5, "min": 0, "max": 30, "step": 0.05 },
    { "id": "item_interval", "type": "number", "role": "timing", "label": "Item interval", "description": "Seconds between successive items filling the queue.", "default": 0.45, "min": 0.15, "max": 2, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 8, "min": 2, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Queue Backpressure</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="queue-backpressure" data-duration="8" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7cqmin;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .qb-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4.4cqmin;
          }
          .qb-badge {
            padding: 1.6cqmin 3.6cqmin;
            border-radius: 999px;
            background: var(--hf-surface, #16181c);
            color: var(--hf-muted, #9aa1ad);
            font-weight: 800;
            font-size: 2.8cqmin;
            letter-spacing: 0.02em;
            border: 0.28cqmin solid var(--hf-border, #2c2f36);
          }
          .qb-badge.full {
            color: #2a0d0d;
            background: #ff6e6e;
            border-color: #ff6e6e;
            opacity: 0;
            transform: scale(0.9);
          }
          .qb-label {
            font-weight: 700;
            font-size: 3.2cqmin;
            opacity: 0.85;
          }
          .qb-slots {
            display: flex;
            gap: 2.2cqmin;
            padding: 2.4cqmin;
            border-radius: var(--hf-radius, 16px);
            background: var(--hf-surface, #16181c);
            border: 0.28cqmin solid var(--hf-border, #2c2f36);
          }
          .qb-slot {
            width: 9cqmin;
            height: 9cqmin;
            min-width: 32px;
            min-height: 32px;
            border-radius: 1.6cqmin;
            border: 0.26cqmin dashed var(--hf-border, #2c2f36);
            position: relative;
            overflow: hidden;
          }
          .qb-slot-item {
            position: absolute;
            inset: 0;
            border-radius: 1.2cqmin;
            background: var(--qb-slot-accent, var(--hf-brand, #6ea8fe));
            opacity: 0;
            transform: scale(0.6);
          }
          .qb-bounce {
            position: absolute;
            width: 9cqmin;
            height: 9cqmin;
            min-width: 32px;
            min-height: 32px;
            border-radius: 1.6cqmin;
            background: #ff6e6e;
            opacity: 0;
          }
        </style>

        <div class="qb-wrap" id="qb-wrap">
          <div class="qb-label" id="qb-label"></div>
          <div class="qb-slots" id="qb-slots"></div>
          <div class="qb-badge" id="qb-badge">Accepting</div>
          <div class="qb-badge full" id="qb-badge-full">QUEUE FULL &mdash; BACKPRESSURE</div>
        </div>
        <div class="qb-bounce" id="qb-bounce"></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "queue-backpressure: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SCHEMA = {
              capacity: { type: "number", default: 6, min: 3, max: 8 },
              queue_label: { type: "string", default: "Message Queue", maxLength: 30 },
              start_at: { type: "number", default: 0.5, min: 0, max: 30 },
              item_interval: { type: "number", default: 0.45, min: 0.15, max: 2 },
              duration: { type: "number", default: 8, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var wrap = document.getElementById("qb-wrap");
            var labelEl = document.getElementById("qb-label");
            var slotsWrap = document.getElementById("qb-slots");
            var badge = document.getElementById("qb-badge");
            var badgeFull = document.getElementById("qb-badge-full");
            var bounce = document.getElementById("qb-bounce");

            // Per-slot accent rotation -- each item filling a slot is a
            // real, discrete arrival event in a fixed order (see file
            // header "Color discipline / judgment call"). Accent first,
            // brand last, matching the sanctioned rotation order.
            var ROTATION = [
              "var(--hf-accent, #71f5a7)",
              "var(--hf-accent-2, #c5a3ff)",
              "var(--hf-accent-3, #ffb84d)",
              "var(--hf-accent-4, #ff6e6e)",
              "var(--hf-brand, #6ea8fe)",
            ];

            var capacity = Math.round(props.capacity);

            // Clear/rebuild: queue slots are torn down and rebuilt from
            // props every mount so a re-seek or variable change never
            // leaves a stale slot from a previous build.
            var slotEls = [];
            HFProps.rebuild(slotsWrap, function (container) {
              slotEls = [];
              for (var i = 0; i < capacity; i++) {
                var slot = document.createElement("div");
                slot.className = "qb-slot";
                var slotAccent = ROTATION[i % ROTATION.length];
                slot.style.setProperty("--qb-slot-accent", slotAccent);
                var item = document.createElement("div");
                item.className = "qb-slot-item";
                slot.appendChild(item);
                container.appendChild(slot);
                slotEls.push({ slot: slot, item: item, accent: slotAccent });
              }
            });

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              HFTextFit.fitOrTruncate(labelEl, props.queue_label, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 700,
                maxWidth: wrap.clientWidth * 0.9,
                maxHeight: 1000,
                baseSize: 3.2 * rootMin,
                minSize: 14,
                maxLines: 1,
              });
            }

            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(function () {
                layout();
                buildTimeline();
              });
            }

            var duration = props.duration;
            var startAt = Math.min(props.start_at, Math.max(0, duration - 2));
            var interval = props.item_interval;

            var tl = gsap.timeline({ paused: true });

            function buildTimeline() {
              tl.clear();

              tl.fromTo(wrap, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);

              // Fill items one at a time, capped so the fill sequence
              // never runs past the instance's own visible window.
              var maxItems = Math.max(1, Math.floor((duration - startAt - 1.2) / interval) + 1);
              var fillCount = Math.min(capacity, maxItems);

              for (var i = 0; i < fillCount; i++) {
                var at = Math.min(startAt + i * interval, Math.max(0, duration - 1.2));
                tl.to(
                  slotEls[i].item,
                  { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)" },
                  at
                );
                tl.to(slotEls[i].slot, { borderColor: slotEls[i].accent, duration: 0.28 }, at);
              }

              if (fillCount >= capacity) {
                var fullAt = Math.min(startAt + (fillCount - 1) * interval + 0.35, Math.max(0, duration - 0.8));

                tl.to(badge, { opacity: 0, duration: 0.2 }, fullAt);
                tl.to(
                  badgeFull,
                  { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" },
                  fullAt
                );
                // A gentle pulse to read as "backpressure holding", not a
                // one-off flash -- a nested repeating tween, deterministic
                // under seek like skeleton-loader.html's shimmer. A FINITE
                // repeat count, never repeat:-1 -- a real bug found this
                // session: repeat:-1 makes GSAP report the whole root
                // timeline's own .duration() as effectively infinite,
                // corrupting the "pad tl.duration() to the authored
                // duration prop" line below (confirmed via a real
                // hyperframes snapshot picking an end-of-timeline frame at
                // ~9.7 BILLION seconds).
                var badgePulseStart = fullAt + 0.3;
                var badgePulseReps = Math.max(1, Math.ceil((duration - badgePulseStart) / 0.5) + 1);
                tl.to(
                  badgeFull,
                  { scale: 1.05, duration: 0.5, ease: "sine.inOut", repeat: badgePulseReps, yoyo: true },
                  badgePulseStart
                );

                // One more item tries to arrive and bounces off the full
                // queue instead of entering -- the visible backpressure
                // signal a producer would see.
                var lastSlotRect = slotEls[capacity - 1].slot;
                var bounceAt = Math.min(fullAt + 0.5, Math.max(0, duration - 0.5));
                tl.call(
                  function () {
                    var slotRect = lastSlotRect.getBoundingClientRect();
                    var rootRect = root.getBoundingClientRect();
                    bounce.style.left = slotRect.right - rootRect.left + 20 + "px";
                    bounce.style.top = slotRect.top - rootRect.top + "px";
                  },
                  null,
                  Math.max(0, bounceAt - 0.01)
                );
                tl.fromTo(
                  bounce,
                  { opacity: 1, x: 40 },
                  { opacity: 1, x: 0, duration: 0.2, ease: "power1.in" },
                  bounceAt
                );
                tl.to(bounce, { x: 40, opacity: 0, duration: 0.25, ease: "power1.out" }, bounceAt + 0.2);
              }

              // Pad tl.duration() to the authored `duration` prop -- see the
              // matching comment in browser-window.html for why.
              tl.set({}, {}, duration);
              tl.seek(0, false);
            }

            buildTimeline();
            window.__timelines["queue-backpressure"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
