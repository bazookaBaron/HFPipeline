<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: setting-control</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <link rel="stylesheet" href="../lib/tokens.css" />
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
      button {
        background: #6ea8fe;
        color: #0b0d10;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>setting-control</h1>
    <p>
      Starts OFF and flips ON at 1.6s. A longer description exercises the 2-line text-fit
      shrink on the helper text.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./setting-control.html",
        mountEl: document.getElementById("stage"),
        compositionId: "setting-control",
        width: 1080,
        height: 1920,
        variables: {
          panel_title: "Privacy",
          label: "Share analytics with third parties",
          description: "Helps us and our partners understand how the product is used across devices, sessions, and campaigns.",
          initial_state: false,
          accent: "accent-3",
          toggle_at: 1.6,
          duration: 5,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
