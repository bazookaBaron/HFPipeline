<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="compositions/components/lib/text-fit.js"></script>
    <script src="compositions/components/lib/props.js"></script>
    <script src="compositions/components/lib/stage/core.js"></script>
    <script src="compositions/components/lib/stage/modules-dh.js"></script>
    <script src="compositions/components/lib/stage/modules-dh2.js"></script>
    <script src="compositions/components/lib/icons.js"></script>
    <script src="compositions/components/lib/stage/modules-dh3.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stage-demo" data-start="0" data-width="1080" data-height="1920">

      <!-- Duration anchor: with a lone sub-composition clip, `hyperframes snapshot` stopped
           showing the stage after ~1.8 s (verified 2026-09-25); an explicit full-length clip
           pins the root's length for every tool. -->
      <div id="duration-anchor" class="clip" data-start="0" data-duration="4.000" data-track-index="9" style="position:absolute; left:0; top:0; width:1px; height:1px;"></div>
      <div
        id="stage-comp"
        data-composition-id="stage-main"
        data-composition-src="compositions/components/stage/stage.html"
        data-variable-values='{"spec":"{\"profile\":\"DH\",\"mascot\":{\"open\":\"assets/mascot/sb_open.png\",\"blink\":\"assets/mascot/sb_blink.png\"},\"scaffolds\":[{\"id\":\"carrier\",\"t0\":0,\"t1\":4,\"layout\":\"column\",\"modules\":[{\"id\":\"hud\",\"type\":\"hud\",\"rect\":[60,235.5,960,69],\"enter\":\"none\",\"props\":{\"host\":\"shop.example.com\",\"env\":\"BLUE\",\"envTone\":\"blue\",\"version\":\"v1.4.2\",\"value\":\"0.4%\",\"valueLabel\":\"errors\"}},{\"id\":\"users\",\"type\":\"users\",\"rect\":[330,571,690,209],\"enter\":\"none\",\"props\":{\"count\":9,\"pitch\":78,\"convergeY\":150}},{\"id\":\"router\",\"type\":\"router\",\"rect\":[330,780,690,64],\"enter\":\"none\",\"props\":{\"left\":100,\"right\":0,\"lever\":\"lever\",\"leftCard\":\"blue\",\"rightCard\":\"green\"}},{\"id\":\"lever\",\"type\":\"lever\",\"rect\":[330,844,690,106],\"enter\":\"none\",\"props\":{\"side\":\"left\"}},{\"id\":\"blue\",\"type\":\"envCard\",\"rect\":[330,949.5,334.5,350.5],\"enter\":\"none\",\"props\":{\"env\":\"blue\",\"live\":true,\"version\":\"v1.4.2\",\"pct\":100,\"instances\":[{\"id\":\"i-0a3f8c21\"},{\"id\":\"i-07b41de9\"},{\"id\":\"i-0c92f5a4\"}]}},{\"id\":\"green\",\"type\":\"envCard\",\"rect\":[684,949.5,331.5,350.5],\"enter\":\"none\",\"props\":{\"env\":\"green\",\"live\":false,\"version\":\"—\",\"pct\":0,\"instances\":[{\"id\":\"i-0d18ba77\",\"status\":\"idle\"},{\"id\":\"i-0e63c40b\",\"status\":\"idle\"},{\"id\":\"i-0f27ae55\",\"status\":\"idle\"}]}}]}],\"events\":[{\"t\":2,\"op\":\"traffic\",\"target\":\"router\",\"value\":{\"left\":0,\"right\":100}},{\"t\":2,\"op\":\"statusAll\",\"target\":\"blue\",\"value\":{\"status\":\"draining\",\"stagger\":0}},{\"t\":2,\"op\":\"statusAll\",\"target\":\"green\",\"value\":{\"status\":\"healthy\",\"stagger\":0.05}}]}","duration":4}'
        data-start="0"
        data-duration="4.000"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
        class="clip"
        style="position:absolute; left:0; top:0; width:1080px; height:1920px;"
      ></div>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Pad the root timeline to the full length (an empty root timeline let snapshot drop the
      // stage after ~1.8 s when no other timeline was registered; verified 2026-09-25).
      tl.set({}, {}, 4.000);
      window.__timelines["stage-demo"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
