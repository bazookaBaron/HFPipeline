<!doctype html>
<!--
  perspective-3d-road -- HyperFrames sub-composition (Data / metrics)

  A road/lane receding toward a vanishing point, covered in glowing
  rectangular "blocks" arranged in rows that get denser/larger toward the
  viewer -- a stylized traffic-jam / congestion visual. An optional big
  headline can scale in over the top at `title_at` (e.g. "A DDOS ATTACK"
  as the visual's climax).

  IMPLEMENTATION CHOICE: true CSS 3D (perspective + rotateX on a
  preserve-3d plane), not a flat cqh/cqw-scaled approximation. Verified via
  this project's own scratch-dir + `hyperframes snapshot` validation loop
  (see ../README.md "Validation") that headless Chrome's screenshot/render
  path composites the rotated plane correctly across the instance's
  duration -- no z-fighting, no invisible-DOM regression. Block SIZE is
  still explicitly scaled per row (bigger nearest row) rather than relying
  purely on the emergent perspective foreshortening, so the "denser/larger
  toward the viewer" read stays legible even at small preview sizes.

  COLOR DISCIPLINE DEVIATION (documented, same class of exception as
  particle-swarm.html and browser-window's traffic-light dots): the blocks
  ARE the content being visualized (congestion/load), not chrome, so
  `accent` defaults to "accent" instead of "brand" here. Still the same
  opt-in enum as every other component.

  Pulsing blocks (when `pulseOn`): a slow repeating opacity/glow pulse on
  each block, the SAME class of exception terminal-session.html documents
  for its blinking cursor -- motion-doctrine's anti-idle-wobble rule bans
  decorative "breathing" motion, but a pulsing congestion/load indicator
  reads as "this system is live/under load", a real content signal, not
  idle motion. Implemented as a GSAP repeating tween keyed off the
  timeline's own paused clock (seek-safe, deterministic under scrub).

  Blocks are built ONCE via HFProps.rebuild before the GSAP timeline
  captures references to each block (see heatmap-matrix.html's header
  comment for the bug class this avoids).

  MULTI-INSTANCE PATTERN: one fixed literal id ("perspective-3d-road");
  every per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="perspective-3d-road"
  data-composition-duration="8"
  data-composition-variables='[
    { "id": "blockRows", "type": "number", "role": "content", "label": "Block rows", "description": "Number of rows of blocks receding into the distance.", "default": 6, "min": 3, "max": 10, "step": 1 },
    { "id": "blocksPerRow", "type": "number", "role": "content", "label": "Blocks per row (nearest)", "description": "Number of blocks in the NEAREST row; farther rows fan in to fewer blocks.", "default": 5, "min": 2, "max": 10, "step": 1 },
    { "id": "pulseOn", "type": "boolean", "role": "content", "label": "Pulse blocks", "description": "Whether blocks pulse/glow (a live-congestion signal, not idle wobble).", "default": true },
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "Optional big centered headline that scales in over the road. Leave blank to omit.", "default": "" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Block glow color. Defaults to the content accent hue (not brand) since the blocks ARE the content -- see header comment.", "default": "accent", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Reveal at", "description": "Seconds from mount when the road and blocks start revealing (farthest row first).", "default": 0.3, "min": 0, "max": 30, "step": 0.05 },
    { "id": "title_at", "type": "number", "role": "timing", "label": "Title at", "description": "Seconds from mount when the headline scales in. Ignored if `title` is blank.", "default": 3.2, "min": 0, "max": 30, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 8, "min": 3, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Perspective 3D Road</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="perspective-3d-road" data-duration="8" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
            overflow: hidden;
          }
          .p3d-stage {
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 90% at 50% 30%, var(--hf-surface, #16181c) 0%, var(--hf-bg, #0b0d10) 70%);
            overflow: hidden;
          }
          .p3d-perspective {
            position: absolute;
            inset: 0;
            perspective: 62cqmin;
            perspective-origin: 50% 34%;
          }
          .p3d-horizon-glow {
            position: absolute;
            left: 50%;
            top: 30%;
            width: 60cqmin;
            height: 60cqmin;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--p3d-accent, var(--hf-accent, #71f5a7)) 0%, transparent 65%);
            opacity: 0.14;
            filter: blur(2cqmin);
          }
          .p3d-road {
            position: absolute;
            left: 50%;
            bottom: -12cqmin;
            width: 4cqmin;
            height: 4cqmin;
            transform-style: preserve-3d;
            transform: translateX(-50%) rotateX(76deg);
          }
          .p3d-rowline {
            position: absolute;
            left: 0;
            width: 1px;
            height: 1px;
          }
          /* Two-tier block: the WRAP carries the fixed 3D position
             (translate3d + centering), set once and never touched by GSAP.
             The inner BLOCK carries only opacity/scale, so GSAP's transform
             decomposition on the inner element never has to reconcile
             against a 3D translate -- avoids fighting GSAP's own transform
             matrix parsing (verified in this project's scratch validation). */
          .p3d-block-wrap {
            position: absolute;
            top: 0;
            left: 0;
          }
          .p3d-block {
            position: absolute;
            inset: 0;
            border-radius: 0.4cqmin;
            background: var(--p3d-accent, var(--hf-accent, #71f5a7));
            box-shadow: 0 0 1.6cqmin var(--p3d-accent, var(--hf-accent, #71f5a7));
            opacity: 0;
            transform: scale(0.5);
          }
          .p3d-title-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8cqmin;
            pointer-events: none;
          }
          .p3d-title {
            font-weight: 800;
            letter-spacing: -0.01em;
            text-align: center;
            color: var(--hf-fg, #f4f5f7);
            text-shadow: 0 0.6cqmin 3cqmin rgba(0, 0, 0, 0.65);
            opacity: 0;
            transform: scale(0.7);
            white-space: nowrap;
          }
        </style>

        <div class="p3d-stage" id="p3d-stage">
          <div class="p3d-horizon-glow"></div>
          <div class="p3d-perspective">
            <div class="p3d-road" id="p3d-road"></div>
          </div>
          <div class="p3d-title-wrap">
            <div class="p3d-title" id="p3d-title"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "perspective-3d-road: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SCHEMA = {
              blockRows: { type: "number", default: 6, min: 3, max: 10 },
              blocksPerRow: { type: "number", default: 5, min: 2, max: 10 },
              pulseOn: { type: "boolean", default: true },
              title: { type: "string", default: "", maxLength: 40 },
              accent: {
                type: "enum",
                default: "accent",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              reveal_at: { type: "number", default: 0.3, min: 0, max: 30 },
              title_at: { type: "number", default: 3.2, min: 0, max: 30 },
              duration: { type: "number", default: 8, min: 3, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var road = document.getElementById("p3d-road");
            var titleEl = document.getElementById("p3d-title");

            root.style.setProperty("--p3d-accent", "var(--hf-" + props.accent + ", var(--hf-accent, #71f5a7))");

            var rows = Math.round(props.blockRows);
            var nearBlocks = Math.round(props.blocksPerRow);

            // Depth spacing along the rotated plane's local Y axis: row 0 is
            // FARTHEST (near the vanishing point), row (rows-1) is NEAREST
            // (closest to the viewer, largest blocks). Spacing grows for
            // nearer rows so the lane visibly widens/accelerates toward camera.
            var rowEls = [];
            var totalBlocks = 0;
            var rowDefs = [];
            var depth = 0;
            for (var r = 0; r < rows; r++) {
              var frac = r / Math.max(1, rows - 1); // 0 = farthest, 1 = nearest
              var step = 9 + frac * 10; // cqmin between this row and the next
              depth += step;
              // Fan-out: farther rows converge to fewer, smaller blocks.
              var count = Math.max(2, Math.round(2 + frac * (nearBlocks - 2)));
              var laneWidth = 14 + frac * 46; // cqmin, half-width the row's blocks spread across
              var blockSize = 3.4 + frac * 7.2; // cqmin
              rowDefs.push({ frac: frac, depth: depth, count: count, laneWidth: laneWidth, blockSize: blockSize });
              totalBlocks += count;
            }

            var blockEls = [];
            HFProps.rebuild(road, function (container) {
              blockEls = [];
              rowDefs.forEach(function (rowDef) {
                for (var i = 0; i < rowDef.count; i++) {
                  var t = rowDef.count === 1 ? 0.5 : i / (rowDef.count - 1);
                  var xOff = (t - 0.5) * 2 * rowDef.laneWidth;
                  var wrap = document.createElement("div");
                  wrap.className = "p3d-block-wrap";
                  wrap.style.width = rowDef.blockSize + "cqmin";
                  wrap.style.height = rowDef.blockSize * 0.62 + "cqmin";
                  // Fixed 3D position, set once -- never animated by GSAP.
                  wrap.style.transform =
                    "translate3d(" + xOff + "cqmin, " + -rowDef.depth + "cqmin, 0) translate(-50%, -50%)";
                  var block = document.createElement("div");
                  block.className = "p3d-block";
                  wrap.appendChild(block);
                  container.appendChild(wrap);
                  blockEls.push({ el: block, row: rowDef });
                }
              });
            });

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              if (props.title) {
                HFTextFit.fitOrTruncate(titleEl, props.title, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 800,
                  maxWidth: root.clientWidth * 0.86 || 800,
                  maxHeight: root.clientHeight * 0.4 || 400,
                  baseSize: 11 * rootMin,
                  minSize: 24,
                  maxLines: 2,
                });
              }
            }
            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var revealAt = Math.min(props.reveal_at, Math.max(0, duration - 1));
            var revealWindow = Math.min(2.2, Math.max(0.4, duration * 0.32));

            var tl = gsap.timeline({ paused: true });

            // Reveal farthest row first, sweeping toward the viewer --
            // deterministic row-major order, no randomness. Only
            // opacity/scale animate here; 3D position is fixed on the
            // wrapper (see rebuild loop above), so GSAP's transform
            // decomposition on `item.el` only ever deals with scale.
            blockEls.forEach(function (item) {
              var at = revealAt + item.row.frac * revealWindow;
              tl.fromTo(
                item.el,
                { opacity: 0, scale: 0.5 },
                { opacity: 0.92, scale: 1, duration: 0.4, ease: "power2.out" },
                Math.min(at, Math.max(0, duration - 0.5))
              );
            });

            // Pulse (opt-in, `pulseOn`): a slow repeating glow, staggered per
            // block so the whole road doesn't pulse in lockstep -- reads as
            // "many independently loaded blocks", not one metronome. A
            // FINITE repeat count, never repeat:-1 -- a real bug found this
            // session: repeat:-1 makes GSAP report the whole root timeline's
            // own .duration() as effectively infinite, corrupting the "pad
            // tl.duration() to the authored duration prop" line below
            // (confirmed via a real hyperframes snapshot picking an
            // end-of-timeline frame at ~9.7 BILLION seconds). Repeating
            // exactly enough times to cover the remaining scene duration
            // pulses correctly without corrupting the timeline's length.
            if (props.pulseOn) {
              blockEls.forEach(function (item, i) {
                var startAt = Math.min(revealAt + item.row.frac * revealWindow + 0.4, Math.max(0, duration - 1));
                var pulseDelay = (i % 5) * 0.15;
                var pulseStart = startAt + pulseDelay;
                var pulseReps = Math.max(1, Math.ceil((duration - pulseStart) / 0.7) + 1);
                tl.to(
                  item.el,
                  {
                    opacity: 0.55,
                    duration: 0.7,
                    ease: "sine.inOut",
                    yoyo: true,
                    repeat: pulseReps,
                  },
                  pulseStart
                );
              });
            }

            if (props.title) {
              var titleAt = Math.min(Math.max(props.title_at, revealAt), Math.max(0, duration - 0.6));
              tl.fromTo(
                titleEl,
                { opacity: 0, scale: 0.7 },
                { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" },
                titleAt
              );
            }

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["perspective-3d-road"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
