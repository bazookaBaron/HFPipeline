<!doctype html>
<!--
  trust-boundary -- HyperFrames sub-composition (Architecture)

  A dashed boundary box marking a trusted zone, with one node inside and
  one node outside (untrusted), and a labeled request traveling from the
  outside node, crossing the boundary line (which flashes brand-accent as
  it's crossed, standing in for an auth check), and arriving at the inside
  node. Proves a security/systems variant of the request-travel pattern
  already established by client-server-exchange.html and etl-pipeline.html,
  this time crossing an explicit zone line rather than going box-to-box.

  Positions (node centers, boundary rect, packet travel path) are measured
  ONCE from real layout via getBoundingClientRect, exactly like the other
  Architecture components in this library, and baked into the GSAP
  timeline before any tween reads them.

  MULTI-INSTANCE PATTERN: one fixed literal id ("trust-boundary"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="trust-boundary"
  data-composition-duration="7"
  data-composition-variables='[
    { "id": "zone_label", "type": "string", "role": "content", "label": "Trusted zone label", "description": "Label on the dashed boundary box.", "default": "Trusted Zone" },
    { "id": "inside_label", "type": "string", "role": "content", "label": "Inside node label", "description": "Node label inside the boundary.", "default": "Internal API" },
    { "id": "outside_label", "type": "string", "role": "content", "label": "Outside node label", "description": "Node label outside the boundary.", "default": "Public Client" },
    { "id": "request_label", "type": "string", "role": "content", "label": "Request label", "description": "Text on the packet crossing the boundary.", "default": "Auth Token" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Boundary-crossing flash + packet color. Opt-in only; default is the fixed brand accent.", "default": "brand", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "cross_at", "type": "number", "role": "timing", "label": "Cross at", "description": "Seconds from mount when the request departs the outside node.", "default": 1.2, "min": 0, "max": 30, "step": 0.05 },
    { "id": "cross_duration", "type": "number", "role": "timing", "label": "Cross duration", "description": "Seconds the request takes to travel and cross the boundary.", "default": 1.2, "min": 0.3, "max": 4, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 7, "min": 2, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Trust Boundary</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="trust-boundary" data-duration="7" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .tb-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg, #0b0d10);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6cqmin;
          }
          .tb-node {
            position: relative;
            z-index: 3;
            width: 26cqmin;
            height: 26cqmin;
            min-width: 92px;
            min-height: 92px;
            border-radius: 2.4cqmin;
            border: 0.3cqmin solid var(--hf-border, #2c2f36);
            background: var(--hf-surface, #16181c);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.6cqmin;
            opacity: 0;
            transform: translateY(1.6cqmin);
          }
          .tb-node-icon {
            width: 7.4cqmin;
            height: 7.4cqmin;
            min-width: 24px;
            min-height: 24px;
            border-radius: 1.2cqmin;
            background: var(--hf-muted, #9aa1ad);
            opacity: 0.4;
          }
          /* Per-zone accent pair: outside (untrusted) vs. inside (trusted)
             are the two real content items here, distinct from the single
             boundary-crossing flash/packet color below (--tb-accent, still
             driven by the `accent` prop -- that stays one fixed color since
             it represents one auth-check event, not a per-zone item). */
          #tb-outside {
            border-color: var(--tb-outside-accent, var(--hf-accent-4, #ff6e6e));
          }
          #tb-outside .tb-node-icon {
            background: var(--tb-outside-accent, var(--hf-accent-4, #ff6e6e));
            opacity: 0.75;
          }
          #tb-inside {
            border-color: var(--tb-inside-accent, var(--hf-accent, #71f5a7));
          }
          #tb-inside .tb-node-icon {
            background: var(--tb-inside-accent, var(--hf-accent, #71f5a7));
            opacity: 0.75;
          }
          .tb-node-label {
            font-weight: 700;
            font-size: 2.9cqmin;
            white-space: nowrap;
            overflow: hidden;
            max-width: 22cqmin;
          }
          .tb-boundary {
            position: absolute;
            top: 12cqmin;
            bottom: 12cqmin;
            right: 6cqmin;
            width: 46cqmin;
            border: 0.3cqmin dashed var(--hf-border, #2c2f36);
            border-radius: 3cqmin;
            z-index: 1;
            transition: border-color 0.25s, box-shadow 0.25s;
          }
          .tb-boundary.tb-flash {
            border-color: var(--tb-accent, var(--hf-brand, #6ea8fe));
            box-shadow: 0 0 4cqmin rgba(110, 168, 254, 0.3);
          }
          .tb-boundary-tag {
            position: absolute;
            top: -1.6cqmin;
            left: 2.6cqmin;
            padding: 0.6cqmin 1.8cqmin;
            background: var(--hf-bg, #0b0d10);
            font-weight: 700;
            font-size: 2.2cqmin;
            color: var(--hf-muted, #9aa1ad);
            white-space: nowrap;
            overflow: hidden;
            max-width: 40cqmin;
          }
          .tb-packet {
            position: absolute;
            top: 50%;
            z-index: 4;
            padding: 1.4cqmin 2.4cqmin;
            border-radius: 999px;
            background: var(--tb-accent, var(--hf-brand, #6ea8fe));
            color: var(--hf-bg, #0b0d10);
            font-weight: 700;
            font-size: 2.6cqmin;
            white-space: nowrap;
            opacity: 0;
            transform: translate(0, -50%);
          }
        </style>

        <div class="tb-stage" id="tb-stage">
          <div class="tb-node" id="tb-outside">
            <div class="tb-node-icon"></div>
            <div class="tb-node-label" id="tb-outside-label"></div>
          </div>
          <div class="tb-boundary" id="tb-boundary">
            <div class="tb-boundary-tag" id="tb-zone-label"></div>
          </div>
          <div class="tb-node" id="tb-inside">
            <div class="tb-node-icon"></div>
            <div class="tb-node-label" id="tb-inside-label"></div>
          </div>
          <div class="tb-packet" id="tb-packet"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "trust-boundary: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SCHEMA = {
              zone_label: { type: "string", default: "Trusted Zone", maxLength: 30 },
              inside_label: { type: "string", default: "Internal API", maxLength: 26 },
              outside_label: { type: "string", default: "Public Client", maxLength: 26 },
              request_label: { type: "string", default: "Auth Token", maxLength: 26 },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              cross_at: { type: "number", default: 1.2, min: 0, max: 30 },
              cross_duration: { type: "number", default: 1.2, min: 0.3, max: 4 },
              duration: { type: "number", default: 7, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var outside = document.getElementById("tb-outside");
            var inside = document.getElementById("tb-inside");
            var outsideLabel = document.getElementById("tb-outside-label");
            var insideLabel = document.getElementById("tb-inside-label");
            var boundary = document.getElementById("tb-boundary");
            var zoneLabel = document.getElementById("tb-zone-label");
            var packet = document.getElementById("tb-packet");

            root.style.setProperty("--tb-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            // Per-zone accent pair (not a full rotation -- this component is
            // exactly 2 conceptual zones, inside vs. outside the trust
            // boundary). Outside/untrusted gets accent-4 (warm), inside/
            // trusted gets accent (green) -- a semantically legible pairing
            // that stays independent of the existing --tb-accent flash/
            // packet color above.
            root.style.setProperty("--tb-outside-accent", "var(--hf-accent-4, #ff6e6e)");
            root.style.setProperty("--tb-inside-accent", "var(--hf-accent, #71f5a7)");

            function fitAll() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              [
                { el: outsideLabel, text: props.outside_label, size: 2.9 },
                { el: insideLabel, text: props.inside_label, size: 2.9 },
              ].forEach(function (item) {
                HFTextFit.fitOrTruncate(item.el, item.text, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 700,
                  maxWidth: 22 * rootMin,
                  maxHeight: 1000,
                  baseSize: item.size * rootMin,
                  minSize: 13,
                  maxLines: 1,
                });
              });
              HFTextFit.fitOrTruncate(zoneLabel, props.zone_label, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 700,
                maxWidth: 40 * rootMin,
                maxHeight: 1000,
                baseSize: 2.2 * rootMin,
                minSize: 11,
                maxLines: 1,
              });
              HFTextFit.fitOrTruncate(packet, props.request_label, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 700,
                maxWidth: 34 * rootMin,
                maxHeight: 1000,
                baseSize: 2.6 * rootMin,
                minSize: 12,
                maxLines: 1,
              });
            }

            fitAll();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(fitAll);
            }

            // Measure ONCE from real layout, relative to #root.
            var rootRect = root.getBoundingClientRect();
            var outsideRect = outside.getBoundingClientRect();
            var insideRect = inside.getBoundingClientRect();
            var packetHalfWidth = packet.getBoundingClientRect().width / 2 || 60;

            var startX = outsideRect.right - rootRect.left;
            var endX = insideRect.left - rootRect.left;
            var midY = outsideRect.top + outsideRect.height / 2 - rootRect.top;
            packet.style.top = midY + "px";

            var travelStart = startX - packetHalfWidth;
            var travelEnd = endX - packetHalfWidth;

            var duration = props.duration;
            var crossAt = Math.min(props.cross_at, Math.max(0, duration - 1));
            var crossDur = Math.min(props.cross_duration, Math.max(0.2, duration - crossAt - 0.3));

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(outside, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
            tl.fromTo(boundary, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.25);
            tl.fromTo(inside, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.35);

            packet.style.left = travelStart + "px";
            tl.set(packet, { left: travelStart, opacity: 0 }, Math.max(0, crossAt - 0.01));
            tl.to(packet, { opacity: 1, duration: 0.2, ease: "power1.out" }, crossAt);
            tl.to(outside, { scale: 1.05, duration: 0.14, ease: "power1.out" }, crossAt);
            tl.to(outside, { scale: 1, duration: 0.2, ease: "power1.in" }, crossAt + 0.14);
            tl.to(packet, { left: travelEnd, duration: crossDur, ease: "power1.inOut" }, crossAt);

            // The boundary flashes brand-accent for the middle portion of
            // the crossing -- the "auth check" beat.
            var flashAt = crossAt + crossDur * 0.35;
            var flashEnd = crossAt + crossDur * 0.85;
            tl.set(boundary, { className: "tb-boundary tb-flash" }, flashAt);
            tl.set(boundary, { className: "tb-boundary" }, flashEnd);

            tl.to(packet, { opacity: 0, duration: 0.2, ease: "power1.in" }, crossAt + crossDur - 0.05);
            tl.to(inside, { scale: 1.05, duration: 0.14, ease: "power1.out" }, crossAt + crossDur - 0.05);
            tl.to(inside, { scale: 1, duration: 0.2, ease: "power1.in" }, crossAt + crossDur + 0.09);

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["trust-boundary"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
