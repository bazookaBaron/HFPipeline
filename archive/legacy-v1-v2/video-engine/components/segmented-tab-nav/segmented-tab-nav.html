<!doctype html>
<!--
  segmented-tab-nav -- HyperFrames sub-composition (Software mockup)

  A pill-shaped segmented control (N tabs) with a sliding active-tab
  indicator that moves and resizes to match whichever tab is active, plus
  a content panel below that crossfades to match. Tabs cycle automatically
  on a fixed interval starting at `start_at` -- no pointer input exists in
  a rendered video, so "the user tapping a tab" is authored as a timed
  autoplay sequence instead, matching browser-window's own "the URL types
  itself" convention for anything a screen recording would otherwise show
  as a real interaction.

  The indicator's left/width per tab are measured ONCE via
  getBoundingClientRect after the tab pills are built and text-fit, then
  baked into the GSAP timeline -- same "measure once from real layout,
  never recompute during playback" discipline as
  client-server-exchange.html's packet travel positions.

  MULTI-INSTANCE PATTERN: one fixed literal id ("segmented-tab-nav");
  every per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="segmented-tab-nav"
  data-composition-duration="9"
  data-composition-variables='[
    { "id": "tabs", "type": "string", "role": "content", "label": "Tabs", "description": "Pipe-separated tab labels.", "default": "Overview|Pricing|Docs" },
    { "id": "contents", "type": "string", "role": "content", "label": "Contents", "description": "Pipe-separated content lines, one per tab in the same order. Extra/missing entries fall back to a generic placeholder per tab.", "default": "See how it all fits together|Simple, usage-based pricing|Everything you need to integrate" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Sliding indicator + active-tab text color. Opt-in only; default is the fixed brand accent.", "default": "brand", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "start_at", "type": "number", "role": "timing", "label": "Start at", "description": "Seconds from mount when the control reveals and the first tab is shown active.", "default": 0.4, "min": 0, "max": 30, "step": 0.05 },
    { "id": "switch_interval", "type": "number", "role": "timing", "label": "Switch interval", "description": "Seconds each tab stays active before switching to the next.", "default": 2, "min": 0.6, "max": 8, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 9, "min": 2, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Segmented Tab Nav</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="segmented-tab-nav" data-duration="9" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7cqmin;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .stn-panel {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6cqmin;
          }
          .stn-segment {
            position: relative;
            display: flex;
            background: var(--hf-surface, #16181c);
            border-radius: 999px;
            padding: 1cqmin;
            opacity: 0;
            transform: translateY(-1cqmin);
          }
          .stn-indicator {
            position: absolute;
            top: 1cqmin;
            bottom: 1cqmin;
            left: 1cqmin;
            border-radius: 999px;
            background: var(--stn-accent, var(--hf-brand, #6ea8fe));
            z-index: 0;
          }
          .stn-tab {
            position: relative;
            z-index: 1;
            flex: 1;
            text-align: center;
            padding: 2.6cqmin 1cqmin;
            font-weight: 700;
            color: var(--hf-muted, #9aa1ad);
            white-space: nowrap;
            overflow: hidden;
          }
          .stn-tab.active {
            color: var(--hf-bg, #0b0d10);
          }
          .stn-content-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
          }
          .stn-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            font-weight: 600;
            line-height: 1.35;
            color: var(--hf-fg, #f4f5f7);
            opacity: 0;
          }
        </style>

        <div class="stn-panel" id="stn-panel">
          <div class="stn-segment" id="stn-segment">
            <div class="stn-indicator" id="stn-indicator"></div>
          </div>
          <div class="stn-content-wrap" id="stn-content-wrap"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "segmented-tab-nav: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SCHEMA = {
              tabs: { type: "list", default: ["Overview", "Pricing", "Docs"], max: 5, delimiter: "|" },
              contents: {
                type: "list",
                default: [
                  "See how it all fits together",
                  "Simple, usage-based pricing",
                  "Everything you need to integrate",
                ],
                max: 5,
                delimiter: "|",
              },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              start_at: { type: "number", default: 0.4, min: 0, max: 30 },
              switch_interval: { type: "number", default: 2, min: 0.6, max: 8 },
              duration: { type: "number", default: 9, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var segment = document.getElementById("stn-segment");
            var indicator = document.getElementById("stn-indicator");
            var contentWrap = document.getElementById("stn-content-wrap");

            root.style.setProperty("--stn-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            // Tabs and their matching content lines always share ONE index
            // space; a caller who supplies fewer content lines than tabs
            // gets a generic per-tab fallback, never a blank/undefined pane.
            var tabLabels = props.tabs;
            var tabEls = [];
            var contentEls = [];
            HFProps.rebuild(segment, function (container) {
              // rebuild clears segment's children -- re-append the
              // indicator first since it must stay inside .stn-segment.
              container.appendChild(indicator);
              tabEls = [];
              tabLabels.forEach(function (label) {
                var tab = document.createElement("div");
                tab.className = "stn-tab";
                container.appendChild(tab);
                tabEls.push({ el: tab, text: label });
              });
            });
            HFProps.rebuild(contentWrap, function (container) {
              contentEls = [];
              tabLabels.forEach(function (label, i) {
                var text = props.contents[i] || "More about " + label;
                var line = document.createElement("div");
                line.className = "stn-content";
                container.appendChild(line);
                contentEls.push({ el: line, text: text });
              });
            });

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              var count = Math.max(1, tabEls.length);
              var tabFontCqmin = count <= 2 ? 3.6 : count <= 4 ? 3 : 2.5;
              tabEls.forEach(function (item) {
                HFTextFit.fitOrTruncate(item.el, item.text, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 700,
                  maxWidth: (segment.clientWidth / count) * 0.86,
                  maxHeight: 1000,
                  baseSize: tabFontCqmin * rootMin,
                  minSize: 12,
                  maxLines: 1,
                });
              });
              var contentFontCqmin = count <= 2 ? 5.2 : 4.2;
              contentEls.forEach(function (item) {
                HFTextFit.fitOrTruncate(item.el, item.text, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 600,
                  maxWidth: contentWrap.clientWidth,
                  maxHeight: contentFontCqmin * rootMin * 1.35 * 3,
                  baseSize: contentFontCqmin * rootMin,
                  minSize: 16,
                  maxLines: 3,
                });
              });
            }

            tabEls.forEach(function (item) {
              item.el.dataset.src = item.text;
            });
            contentEls.forEach(function (item) {
              item.el.dataset.src = item.text;
            });

            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(function () {
                layout();
                measureAndBuild();
              });
            }

            var duration = props.duration;
            var startAt = Math.min(props.start_at, Math.max(0, duration - 0.5));
            var interval = props.switch_interval;

            var tl = gsap.timeline({ paused: true });

            function measureAndBuild() {
              tl.clear();

              // Measure each tab's pill rect ONCE from real layout, in the
              // segment's own local coordinate space -- never recomputed
              // during playback (client-server-exchange.html's same rule).
              var segRect = segment.getBoundingClientRect();
              var rects = tabEls.map(function (item) {
                var r = item.el.getBoundingClientRect();
                return { left: r.left - segRect.left, width: r.width };
              });

              tl.fromTo(segment, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, Math.max(0, startAt - 0.2));

              if (rects.length > 0) {
                indicator.style.left = rects[0].left + "px";
                indicator.style.width = rects[0].width + "px";
              }

              var n = tabEls.length || 1;
              // Cap the number of switches so the sequence never runs past
              // the instance's own visible window.
              var maxSteps = Math.max(1, Math.floor((duration - startAt - 0.3) / interval) + 1);
              var steps = Math.min(n, maxSteps);

              for (var i = 0; i < steps; i++) {
                var at = Math.min(startAt + i * interval, Math.max(0, duration - 0.3));
                (function (i, at) {
                  tabEls.forEach(function (item, j) {
                    tl.set(item.el, { className: "stn-tab" + (j === i ? " active" : "") }, at);
                  });
                  tl.to(indicator, { left: rects[i].left, width: rects[i].width, duration: 0.4, ease: "power2.inOut" }, at);
                  contentEls.forEach(function (line, j) {
                    tl.to(line.el, { opacity: j === i ? 1 : 0, duration: 0.3, ease: "power1.inOut" }, at + (j === i ? 0.1 : 0));
                  });
                })(i, at);
              }

              // Pad tl.duration() to the authored `duration` prop -- see the
              // matching comment in browser-window.html for why.
              tl.set({}, {}, duration);
              tl.seek(0, false);
            }

            measureAndBuild();
            window.__timelines["segmented-tab-nav"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
