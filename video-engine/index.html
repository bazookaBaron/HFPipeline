<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Shared component library globals (HFTextFit, HFProps) -- every
         composition under compositions/components/ assumes these are
         already loaded on window before it mounts. Load order matters:
         must come before any data-composition-src mount below. -->
    <script src="compositions/components/lib/text-fit.js"></script>
    <script src="compositions/components/lib/props.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #title {
        color: #f4f5f7;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
    >
      <audio
        id="narration"
        class="clip"
        data-start="0"
        data-track-index="0"
        src="./assets/narration.wav"
      ></audio>

      <div
        id="browser-window-comp"
        data-composition-id="browser-window"
        data-composition-src="compositions/components/browser-window/browser-window.html"
        data-variable-values='{
          "url": "https://cs-explainer.dev/browser-window",
          "heading": "Page content",
          "row_count": 3,
          "accent": "brand",
          "type_at": 5.051,
          "type_duration": 2.085,
          "content_at": 8.82,
          "duration": 11.5
        }'
        data-start="0"
        data-duration="11.5"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>

      <div
        id="content-panel-comp"
        data-composition-id="content-panel"
        data-composition-src="compositions/components/content-panel/content-panel.html"
        data-variable-values='{
          "title": "Two things that matter",
          "items": "Ship the smallest useful version|Measure before you optimize",
          "accent": "brand",
          "reveal_at": 0.3,
          "item_stagger": 0.5,
          "duration": 6
        }'
        data-start="12"
        data-duration="6"
        data-width="1080"
        data-height="1920"
        data-track-index="1"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
