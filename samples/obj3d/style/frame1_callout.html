<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>

.tag.small .t { font-size:46px; } .tag.small { padding:18px 26px 20px; }

.title { position:absolute; left:80px; right:80px; top:150px; }
</style></head><body>

  <circle cx="900" cy="1330" r="11" fill="none" stroke="#1c1c1a" stroke-width="3.5"/><circle cx="900" cy="1330" r="4" fill="#1c1c1a"/>
  <polyline points="900,1342 900,1500 840,1560" fill="none" stroke="#1c1c1a" stroke-width="3"/>
</svg>
<div class="co tag" style="left:600px; top:330px; width:420px"><div class="k">Ever Given</div><div class="t">400 m long</div><div class="s">200,000 t · bank to bank</div></div>

</body></html>
