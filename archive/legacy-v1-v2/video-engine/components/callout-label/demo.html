<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: callout-label</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <link rel="stylesheet" href="../lib/tokens.css" />
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        transform-origin: top center;
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #1e2126, #05060a 70%);
      }
      #controls {
        display: flex;
        align-items: center;
      }
      button {
        background: #6ea8fe;
        color: #0b0d10;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>callout-label</h1>
    <p>
      Annotation primitive: transparent outside its own marker/line/chip, meant to composite over other
      content. This instance overrides <code>direction</code> (right), <code>x_pct</code>/<code>y_pct</code>
      and a long <code>text</code> value to exercise text-fit truncation on the chip.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./callout-label.html",
        mountEl: document.getElementById("stage"),
        compositionId: "callout-label",
        width: 1080,
        height: 1920,
        variables: {
          text: "Real-time sync happens here automatically",
          x_pct: 28,
          y_pct: 55,
          direction: "right",
          accent: "accent",
          reveal_at: 0.5,
          duration: 5,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
