<!doctype html>
<!--
  definition-card -- HyperFrames sub-composition (Narrative)

  A term + its definition, card-styled: the term reveals first (large,
  bold, brand-accent underline rule), then the definition reveals after a
  beat below a divider. Built on the content-panel skeleton.

  MULTI-INSTANCE PATTERN: one fixed literal id ("definition-card"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="definition-card"
  data-composition-duration="6"
  data-composition-variables='[
    { "id": "term", "type": "string", "role": "content", "label": "Term", "description": "The word or phrase being defined.", "default": "Idempotent" },
    { "id": "definition", "type": "string", "role": "content", "label": "Definition", "description": "The definition text.", "default": "Calling it once or calling it many times leaves the system in exactly the same state." },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Term underline rule + divider color. Opt-in only; default is the fixed brand accent.", "default": "brand", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "term_at", "type": "number", "role": "timing", "label": "Term at", "description": "Seconds from mount when the term reveals.", "default": 0.3, "min": 0, "max": 30, "step": 0.05 },
    { "id": "definition_at", "type": "number", "role": "timing", "label": "Definition at", "description": "Seconds from mount when the definition reveals.", "default": 1.3, "min": 0, "max": 30, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 6, "min": 2, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Definition Card</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="definition-card" data-duration="6" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .dc-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7cqmin;
          }
          .dc-card {
            width: 100%;
            max-width: 86cqw;
            background: var(--hf-surface, #16181c);
            border: 1px solid var(--hf-border, #2c2f36);
            border-radius: 2.2cqmin;
            padding: 6cqmin 6.5cqmin;
            display: flex;
            flex-direction: column;
            gap: 3cqmin;
          }
          .dc-term-wrap {
            opacity: 0;
            transform: translateY(1.4cqmin);
            display: flex;
            flex-direction: column;
            gap: 1.4cqmin;
            align-items: flex-start;
          }
          .dc-term {
            font-weight: 800;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
          }
          .dc-term-rule {
            height: 0.5cqmin;
            min-height: 3px;
            width: 12cqmin;
            background: var(--dc-accent, var(--hf-brand, #6ea8fe));
            border-radius: 999px;
            transform: scaleX(0);
            transform-origin: left center;
          }
          .dc-divider {
            height: 1px;
            background: var(--hf-border, #2c2f36);
            opacity: 0;
          }
          .dc-definition {
            opacity: 0;
            transform: translateY(1.4cqmin);
            font-weight: 500;
            line-height: 1.4;
            color: var(--hf-muted, #9aa1ad);
          }
        </style>

        <div class="dc-stage" id="dc-stage">
          <div class="dc-card" id="dc-card">
            <div class="dc-term-wrap" id="dc-term-wrap">
              <div class="dc-term" id="dc-term"></div>
              <div class="dc-term-rule" id="dc-term-rule"></div>
            </div>
            <div class="dc-divider" id="dc-divider"></div>
            <div class="dc-definition" id="dc-definition"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "definition-card: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SCHEMA = {
              term: { type: "string", default: "Idempotent", maxLength: 40 },
              definition: {
                type: "string",
                default: "Calling it once or calling it many times leaves the system in exactly the same state.",
                maxLength: 220,
              },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              term_at: { type: "number", default: 0.3, min: 0, max: 30 },
              definition_at: { type: "number", default: 1.3, min: 0, max: 30 },
              duration: { type: "number", default: 6, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var card = document.getElementById("dc-card");
            var termWrap = document.getElementById("dc-term-wrap");
            var termEl = document.getElementById("dc-term");
            var termRule = document.getElementById("dc-term-rule");
            var divider = document.getElementById("dc-divider");
            var defEl = document.getElementById("dc-definition");

            root.style.setProperty("--dc-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            function layout() {
              var boxWidth = card.clientWidth - card.clientWidth * 0.06;
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;

              HFTextFit.fitOrTruncate(termEl, props.term, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 800,
                maxWidth: boxWidth,
                maxHeight: 1000,
                baseSize: 8.2 * rootMin,
                minSize: 24,
                maxLines: 1,
              });

              HFTextFit.fitOrTruncate(defEl, props.definition, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 500,
                maxWidth: boxWidth,
                maxHeight: 4.1 * rootMin * 1.4 * 4,
                baseSize: 4.1 * rootMin,
                minSize: 16,
                lineHeightRatio: 1.4,
                maxLines: 4,
              });
            }

            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var termAt = Math.min(props.term_at, Math.max(0, duration - 0.3));
            var defAt = Math.min(Math.max(props.definition_at, termAt + 0.4), Math.max(0, duration - 0.2));

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(termWrap, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, termAt);
            tl.to(termRule, { scaleX: 1, duration: 0.5, ease: "power2.out" }, termAt + 0.15);
            tl.to(divider, { opacity: 1, duration: 0.35, ease: "power1.out" }, defAt - 0.15);
            tl.fromTo(defEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, defAt);

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["definition-card"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
