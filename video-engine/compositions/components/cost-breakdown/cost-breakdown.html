<!doctype html>
<!--
  cost-breakdown -- HyperFrames sub-composition (Data / metrics)

  A cost breakdown donut: an SVG ring built from N stroke-dasharray arcs
  (one per category), each drawing in with a stroke-dashoffset tween as
  its legend row (label + value) fades in beside it, staggered in
  descending-value order. The center shows a count-up total.

  Categories are distinguished by rotating through --hf-accent, -2, -3, -4,
  then --hf-brand by index (added in the aesthetic-plan pass; was previously
  a per-index opacity ramp on one fixed hue, matching latency-waterfall's
  older discipline) -- mini-legend.html/folder-tree.html's established "N
  simultaneous content items" pattern (README "Color discipline": accent-2/
  3/4 exist specifically to distinguish content items like these donut
  categories). Replaces the earlier single `accent` prop, which is no
  longer meaningful once every segment has its own color -- removed from
  this component's schema entirely rather than left as a vestigial no-op.

  MULTI-INSTANCE PATTERN: one fixed literal id ("cost-breakdown"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="cost-breakdown"
  data-composition-duration="8"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "Heading above the donut.", "default": "Monthly cost breakdown" },
    { "id": "categories", "type": "string", "role": "content", "label": "Categories", "description": "JSON array of {label, value} objects, 2-5 items.", "default": "[{\"label\":\"Compute\",\"value\":420},{\"label\":\"Storage\",\"value\":180},{\"label\":\"Network\",\"value\":90},{\"label\":\"Other\",\"value\":60}]" },
    { "id": "currency", "type": "string", "role": "content", "label": "Currency prefix", "description": "Prefix shown before every value (e.g. $).", "default": "$" },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Reveal at", "description": "Seconds from mount when the title and donut ring appear.", "default": 0.3, "min": 0, "max": 30, "step": 0.05 },
    { "id": "segment_stagger", "type": "number", "role": "timing", "label": "Segment stagger", "description": "Seconds between successive segment/legend reveals.", "default": 0.35, "min": 0.1, "max": 2, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 8, "min": 3, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Cost Breakdown</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="cost-breakdown" data-duration="8" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .cb-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            flex-direction: column;
            gap: 4cqmin;
            padding: 8cqmin 7cqmin;
          }
          .cb-title {
            font-weight: 800;
            letter-spacing: -0.01em;
            opacity: 0;
            transform: translateY(1.4cqmin);
            white-space: nowrap;
            overflow: hidden;
            flex: 0 0 auto;
          }
          .cb-body {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            gap: 6cqmin;
          }
          .cb-donut-wrap {
            position: relative;
            flex: 0 0 auto;
            width: 46cqmin;
            height: 46cqmin;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          .cb-donut-wrap svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
          }
          .cb-seg {
            fill: none;
            stroke: var(--cb-accent, var(--hf-brand, #6ea8fe));
          }
          .cb-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6cqmin;
            opacity: 0;
          }
          .cb-center-value {
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--hf-fg, #f4f5f7);
          }
          .cb-center-label {
            font-weight: 600;
            color: var(--hf-muted, #9aa1ad);
          }
          .cb-legend {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2.6cqmin;
          }
          .cb-legend-item {
            display: flex;
            align-items: center;
            gap: 1.6cqmin;
            opacity: 0;
            transform: translateY(1cqmin);
          }
          .cb-swatch {
            flex: 0 0 auto;
            width: 2.2cqmin;
            height: 2.2cqmin;
            min-width: 10px;
            min-height: 10px;
            border-radius: 4px;
            background: var(--cb-accent, var(--hf-brand, #6ea8fe));
          }
          .cb-legend-text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.2cqmin;
          }
          .cb-legend-label {
            font-weight: 600;
            color: var(--hf-fg, #f4f5f7);
            white-space: nowrap;
            overflow: hidden;
          }
          .cb-legend-value {
            font-weight: 700;
            color: var(--hf-muted, #9aa1ad);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
          }
        </style>

        <div class="cb-stage" id="cb-stage">
          <div class="cb-title" id="cb-title"></div>
          <div class="cb-body">
            <div class="cb-donut-wrap" id="cb-donut-wrap">
              <svg viewBox="0 0 100 100" id="cb-svg"></svg>
              <div class="cb-center" id="cb-center">
                <div class="cb-center-value" id="cb-center-value">0</div>
                <div class="cb-center-label">Total</div>
              </div>
            </div>
            <div class="cb-legend" id="cb-legend"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "cost-breakdown: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var DEFAULT_CATEGORIES = [
              { label: "Compute", value: 420 },
              { label: "Storage", value: 180 },
              { label: "Network", value: 90 },
              { label: "Other", value: 60 },
            ];

            var SCHEMA = {
              title: { type: "string", default: "Monthly cost breakdown", maxLength: 80 },
              categories: { type: "list", default: DEFAULT_CATEGORIES, max: 5, delimiter: "|" },
              currency: { type: "string", default: "$", maxLength: 3 },
              reveal_at: { type: "number", default: 0.3, min: 0, max: 30 },
              segment_stagger: { type: "number", default: 0.35, min: 0.1, max: 2 },
              duration: { type: "number", default: 8, min: 3, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var stage = document.getElementById("cb-stage");
            var titleEl = document.getElementById("cb-title");
            var svg = document.getElementById("cb-svg");
            var centerEl = document.getElementById("cb-center");
            var centerValueEl = document.getElementById("cb-center-value");
            var legend = document.getElementById("cb-legend");

            // Per-category rotation, matching mini-legend.html/folder-tree.html exactly --
            // real hex fallbacks so this still renders correctly in isolation.
            var ACCENT_ROTATION = [
              "var(--hf-accent, #71f5a7)",
              "var(--hf-accent-2, #c5a3ff)",
              "var(--hf-accent-3, #ffb84d)",
              "var(--hf-accent-4, #ff6e6e)",
              "var(--hf-brand, #6ea8fe)",
            ];

            function normalizeCategory(raw, i) {
              raw = raw && typeof raw === "object" ? raw : {};
              var fallback = DEFAULT_CATEGORIES[i % DEFAULT_CATEGORIES.length];
              var label = typeof raw.label === "string" && raw.label.trim() ? raw.label.trim() : fallback.label;
              var value = typeof raw.value === "number" && isFinite(raw.value) && raw.value > 0 ? raw.value : fallback.value;
              return { label: label, value: value };
            }

            var categories = props.categories.slice(0, 5).map(normalizeCategory);
            if (categories.length < 2) {
              categories = DEFAULT_CATEGORIES.map(normalizeCategory);
            }

            var total = categories.reduce(function (sum, c) {
              return sum + c.value;
            }, 0);

            var RADIUS = 40;
            var CIRC = 2 * Math.PI * RADIUS;
            var GAP = CIRC * 0.012; // small visual gap between arcs

            var segEls = [];
            var legendEls = [];
            var cumulative = 0;
            HFProps.rebuild(svg, function (container) {
              segEls = [];
              // Track background ring for context.
              var bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              bg.setAttribute("cx", "50");
              bg.setAttribute("cy", "50");
              bg.setAttribute("r", String(RADIUS));
              bg.setAttribute("fill", "none");
              bg.setAttribute("stroke", "var(--hf-surface-2, #1e2126)");
              bg.setAttribute("stroke-width", "14");
              container.appendChild(bg);

              categories.forEach(function (cat, i) {
                var frac = cat.value / total;
                var len = Math.max(0, frac * CIRC - GAP);
                var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("class", "cb-seg");
                circle.setAttribute("cx", "50");
                circle.setAttribute("cy", "50");
                circle.setAttribute("r", String(RADIUS));
                circle.setAttribute("stroke-width", "14");
                circle.setAttribute("stroke-linecap", "round");
                circle.style.stroke = ACCENT_ROTATION[i % ACCENT_ROTATION.length];
                circle.setAttribute("stroke-dasharray", len + " " + (CIRC - len));
                circle.setAttribute("stroke-dashoffset", String(-((cumulative / total) * CIRC)));
                // Start fully un-drawn; the timeline animates dasharray-based
                // reveal via a proxy so it works under seek/scrub.
                container.appendChild(circle);
                segEls.push({ el: circle, fullLen: len, offset: -((cumulative / total) * CIRC) });
                cumulative += cat.value;
              });
            });

            // Start every arc collapsed to zero length (dasharray 0, gap FULL)
            segEls.forEach(function (seg) {
              seg.el.setAttribute("stroke-dasharray", "0 " + CIRC);
            });

            HFProps.rebuild(legend, function (container) {
              legendEls = [];
              categories.forEach(function (cat, i) {
                var item = document.createElement("div");
                item.className = "cb-legend-item";
                var swatch = document.createElement("span");
                swatch.className = "cb-swatch";
                swatch.style.background = ACCENT_ROTATION[i % ACCENT_ROTATION.length];
                var textWrap = document.createElement("div");
                textWrap.className = "cb-legend-text";
                var labelEl = document.createElement("div");
                labelEl.className = "cb-legend-label";
                var valueEl = document.createElement("div");
                valueEl.className = "cb-legend-value";
                valueEl.textContent = props.currency + Math.round(cat.value).toLocaleString();
                textWrap.appendChild(labelEl);
                textWrap.appendChild(valueEl);
                item.appendChild(swatch);
                item.appendChild(textWrap);
                container.appendChild(item);
                legendEls.push({ el: item, labelEl: labelEl, cat: cat });
              });
            });

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              var titleBoxWidth = stage.clientWidth - stage.clientWidth * 0.14;

              HFTextFit.fitOrTruncate(titleEl, props.title, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 800,
                maxWidth: titleBoxWidth,
                maxHeight: 1000,
                baseSize: 6.2 * rootMin,
                minSize: 18,
                maxLines: 1,
              });

              var legendBoxWidth = legend.clientWidth - 5 * rootMin || 200;
              legendEls.forEach(function (item) {
                HFTextFit.fitOrTruncate(item.labelEl, item.cat.label, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 600,
                  maxWidth: legendBoxWidth,
                  maxHeight: 1000,
                  baseSize: 3.2 * rootMin,
                  minSize: 14,
                  maxLines: 1,
                });
              });
            }

            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var revealAt = Math.min(props.reveal_at, Math.max(0, duration - 0.5));
            var stagger = props.segment_stagger;

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(titleEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, revealAt);
            tl.fromTo(
              document.getElementById("cb-donut-wrap"),
              { opacity: 0, scale: 0.9 },
              { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
              revealAt + 0.15
            );

            var segStart = revealAt + 0.4;
            segEls.forEach(function (seg, i) {
              var at = Math.min(segStart + i * stagger, Math.max(0, duration - 0.5));
              var proxy = { len: 0 };
              tl.to(
                proxy,
                {
                  len: seg.fullLen,
                  duration: Math.min(stagger * 0.9, Math.max(0.15, duration - at - 0.2)),
                  ease: "power2.out",
                  onUpdate: function () {
                    seg.el.setAttribute("stroke-dasharray", proxy.len + " " + (CIRC - proxy.len));
                    seg.el.setAttribute("stroke-dashoffset", String(seg.offset));
                  },
                },
                at
              );
              tl.fromTo(
                legendEls[i].el,
                { opacity: 0, y: 8 },
                { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
                at
              );
            });

            var totalAt = Math.min(segStart + categories.length * stagger, Math.max(0, duration - 0.4));
            var totalProxy = { v: 0 };
            tl.fromTo(centerEl, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, totalAt);
            tl.to(
              totalProxy,
              {
                v: total,
                duration: Math.min(0.7, Math.max(0.15, duration - totalAt - 0.1)),
                ease: "power2.out",
                onUpdate: function () {
                  centerValueEl.textContent = props.currency + Math.round(totalProxy.v).toLocaleString();
                },
              },
              totalAt
            );

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["cost-breakdown"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
