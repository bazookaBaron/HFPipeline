<!DOCTYPE html>
<!--
  media-frame -- HyperFrames sub-composition (software mockup / Foundation)

  A bordered frame/window chrome around a generic captured-screen placeholder
  (image or video), for showing "here's what was captured" without a
  URL-bar-specific browser affordance (see browser-window for that variant).
  Neutral title-bar dots (no traffic-light colors -- this isn't a browser
  chrome, so the dots stay token-muted, matching terminal-session). The body
  is a placeholder media rectangle (soft gradient + a type icon) that scales
  and fades in, with an optional caption revealed underneath afterward.

  MULTI-INSTANCE PATTERN (see ../README.md): one fixed literal
  data-composition-id/timeline key ("media-frame"). Every per-instance
  difference (label, media type, caption, timing, accent) is a declared
  variable resolved via lib/props.js -- never a forked file.

  Variables:
    - label        (string): small label in the muted title bar.
    - media_type   (enum: image|video): selects the placeholder icon.
    - caption      (string): optional caption line revealed under the frame.
    - show_caption (boolean): whether the caption is shown at all.
    - reveal_at    (number, seconds): when the media placeholder scales/fades in.
    - caption_at   (number, seconds): when the caption reveals (clamped after
                   reveal_at).
    - accent       (enum): icon + focus-ring color. Opt-in; default is the
                   fixed brand accent.
    - duration     (number, seconds): total instance length.

  Registers window.__timelines["media-frame"] under the literal key.
-->
<html lang="en" data-composition-id="media-frame" data-composition-duration="6" data-composition-variables="[
    { &quot;id&quot;: &quot;label&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Label&quot;, &quot;description&quot;: &quot;Small label shown in the muted title bar.&quot;, &quot;default&quot;: &quot;Recording&quot; },
    { &quot;id&quot;: &quot;media_type&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Media type&quot;, &quot;description&quot;: &quot;Selects the placeholder icon.&quot;, &quot;default&quot;: &quot;video&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;video&quot;, &quot;label&quot;: &quot;Video&quot; }, { &quot;value&quot;: &quot;image&quot;, &quot;label&quot;: &quot;Image&quot; }] },
    { &quot;id&quot;: &quot;caption&quot;, &quot;type&quot;: &quot;string&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Caption&quot;, &quot;description&quot;: &quot;Optional caption line revealed under the frame.&quot;, &quot;default&quot;: &quot;Feature walkthrough&quot; },
    { &quot;id&quot;: &quot;show_caption&quot;, &quot;type&quot;: &quot;boolean&quot;, &quot;role&quot;: &quot;content&quot;, &quot;label&quot;: &quot;Show caption&quot;, &quot;description&quot;: &quot;Whether the caption line is shown at all.&quot;, &quot;default&quot;: true },
    { &quot;id&quot;: &quot;reveal_at&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Reveal at&quot;, &quot;description&quot;: &quot;Seconds from mount when the media placeholder scales/fades in.&quot;, &quot;default&quot;: 0.3, &quot;min&quot;: 0, &quot;max&quot;: 30, &quot;step&quot;: 0.05 },
    { &quot;id&quot;: &quot;caption_at&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Caption at&quot;, &quot;description&quot;: &quot;Seconds from mount when the caption reveals (clamped after reveal_at).&quot;, &quot;default&quot;: 1.6, &quot;min&quot;: 0, &quot;max&quot;: 30, &quot;step&quot;: 0.05 },
    { &quot;id&quot;: &quot;accent&quot;, &quot;type&quot;: &quot;enum&quot;, &quot;role&quot;: &quot;style&quot;, &quot;label&quot;: &quot;Accent&quot;, &quot;description&quot;: &quot;Icon + focus-ring color. Opt-in only; default is the fixed brand accent.&quot;, &quot;default&quot;: &quot;brand&quot;, &quot;options&quot;: [{ &quot;value&quot;: &quot;brand&quot;, &quot;label&quot;: &quot;Brand&quot; }, { &quot;value&quot;: &quot;accent&quot;, &quot;label&quot;: &quot;Accent&quot; }, { &quot;value&quot;: &quot;accent-2&quot;, &quot;label&quot;: &quot;Accent 2&quot; }, { &quot;value&quot;: &quot;accent-3&quot;, &quot;label&quot;: &quot;Accent 3&quot; }, { &quot;value&quot;: &quot;accent-4&quot;, &quot;label&quot;: &quot;Accent 4&quot; }] },
    { &quot;id&quot;: &quot;duration&quot;, &quot;type&quot;: &quot;number&quot;, &quot;role&quot;: &quot;timing&quot;, &quot;label&quot;: &quot;Duration&quot;, &quot;description&quot;: &quot;Total seconds this instance plays. Read from props, never from static markup.&quot;, &quot;default&quot;: 6, &quot;min&quot;: 2, &quot;max&quot;: 30, &quot;step&quot;: 0.1 }
  ]">
  <head>
    <meta charset="UTF-8">
    <title>Media Frame</title>
  </head>
  <body>
    <template>
      <div data-hf-id="hf-degv" id="root" data-composition-id="media-frame" data-duration="6" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6cqmin;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          /* Small/low-element-count component: expand to fill the frame
             rather than sitting in a small fixed box (README hard rule). */
          .mf-card {
            width: 100%;
            height: 100%;
            max-width: 118cqh;
            border-radius: calc(var(--hf-radius, 16px) * 1.25);
            overflow: hidden;
            background: var(--hf-surface, #16181c);
            box-shadow: 0 4cqh 10cqh rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
          }
          .mf-chrome {
            display: flex;
            align-items: center;
            gap: 2.6cqmin;
            padding: 2.6cqmin 3.2cqmin;
            background: var(--hf-surface-2, #1e2126);
            border-bottom: 1px solid var(--hf-border, #2c2f36);
            flex: 0 0 auto;
          }
          .mf-dots {
            display: flex;
            gap: 1.2cqmin;
            flex-shrink: 0;
          }
          .mf-dot {
            width: 1.7cqmin;
            height: 1.7cqmin;
            border-radius: 50%;
            background: var(--hf-border, #2c2f36);
          }
          .mf-label {
            color: var(--hf-muted, #9aa1ad);
            font-size: 2.4cqmin;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
          }
          .mf-body {
            flex: 1;
            min-height: 0;
            padding: 4.4cqmin;
            background: var(--hf-bg, #0b0d10);
            display: flex;
            flex-direction: column;
            gap: 3cqmin;
          }
          .mf-media {
            flex: 1;
            min-height: 0;
            border-radius: var(--hf-radius-sm, 10px);
            background: linear-gradient(135deg, var(--hf-surface-2, #1e2126), var(--hf-surface, #16181c));
            border: 1px solid var(--hf-border, #2c2f36);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.92);
          }
          .mf-icon {
            width: 14cqmin;
            height: 14cqmin;
            color: var(--mf-accent, var(--hf-brand, #6ea8fe));
          }
          .mf-caption {
            flex: 0 0 auto;
            color: var(--hf-muted, #9aa1ad);
            font-weight: 500;
            opacity: 0;
            transform: translateY(1.2cqmin);
            white-space: nowrap;
            overflow: hidden;
          }
        </style>

        <div data-hf-id="hf-m3se" class="mf-card" id="mf-card">
          <div data-hf-id="hf-z1pk" class="mf-chrome">
            <div data-hf-id="hf-178l" class="mf-dots" aria-hidden="true">
              <div data-hf-id="hf-qceb" class="mf-dot"></div>
              <div data-hf-id="hf-2nk3" class="mf-dot"></div>
              <div data-hf-id="hf-2992" class="mf-dot"></div>
            </div>
            <div data-hf-id="hf-from" class="mf-label" id="mf-label"></div>
          </div>
          <div data-hf-id="hf-oegi" class="mf-body">
            <div data-hf-id="hf-z6pu" class="mf-media" id="mf-media">
              <svg data-hf-id="hf-lt8p" class="mf-icon" id="mf-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" />
            </div>
            <div data-hf-id="hf-1mye" class="mf-caption" id="mf-caption"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "media-frame: HFTextFit/HFProps not found on window. " +
                  "The host page must load compositions/components/lib/text-fit.js " +
                  "and lib/props.js before mounting this composition."
              );
            }

            var SCHEMA = {
              label: { type: "string", default: "Recording", maxLength: 40 },
              media_type: { type: "enum", default: "video", options: ["video", "image"] },
              caption: { type: "string", default: "Feature walkthrough", maxLength: 80 },
              show_caption: { type: "boolean", default: true },
              reveal_at: { type: "number", default: 0.3, min: 0, max: 30 },
              caption_at: { type: "number", default: 1.6, min: 0, max: 30 },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              duration: { type: "number", default: 6, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var card = document.getElementById("mf-card");
            var labelEl = document.getElementById("mf-label");
            var media = document.getElementById("mf-media");
            var icon = document.getElementById("mf-icon");
            var caption = document.getElementById("mf-caption");

            root.style.setProperty("--mf-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            // Icon paths are plain inline SVG markup, not text -- swapped
            // wholesale per media_type rather than measured/text-fit (no
            // dynamic text involved here).
            var ICONS = {
              video:
                '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M10 8.5V15.5L16 12L10 8.5Z" fill="currentColor"/>',
              image:
                '<rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor"/><path d="M21 15L16 10L5 20" stroke="currentColor" stroke-width="1.5" fill="none"/>',
            };
            icon.innerHTML = ICONS[props.media_type] || ICONS.video;

            caption.style.display = props.show_caption ? "" : "none";

            function layout() {
              var boxWidth = card.clientWidth - card.clientWidth * 0.088 * 2;
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;

              HFTextFit.fitOrTruncate(labelEl, props.label, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 600,
                maxWidth: boxWidth * 0.6,
                maxHeight: 1000,
                baseSize: 2.4 * rootMin,
                minSize: 12,
                maxLines: 1,
              });

              if (props.show_caption) {
                HFTextFit.fitOrTruncate(caption, props.caption, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 500,
                  maxWidth: boxWidth,
                  maxHeight: 1000,
                  baseSize: 3 * rootMin,
                  minSize: 14,
                  maxLines: 1,
                });
              }
            }
            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var revealAt = Math.min(props.reveal_at, Math.max(0, duration - 0.3));
            var captionAt = props.show_caption
              ? Math.min(Math.max(props.caption_at, revealAt + 0.5), Math.max(0, duration - 0.15))
              : null;

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
            tl.fromTo(
              media,
              { opacity: 0, scale: 0.92 },
              { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" },
              revealAt
            );
            if (captionAt != null) {
              tl.fromTo(
                caption,
                { opacity: 0, y: 12 },
                { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
                captionAt
              );
            }

            // Pad tl.duration() to the authored `duration` prop -- see
            // browser-window.html for the full rationale.
            tl.set({}, {}, duration);
            window.__timelines["media-frame"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
