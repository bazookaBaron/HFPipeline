<body><script type="module">

// Engine = suez.html (camera solver, occlusion fix, gates, MG2D compositor, subjects registry); world = malacca-world.js; map = malacca-map.js;
// 2D MG = mg2d/board.js (link boards) + mg2d/timeline.js (paper-strip timeline); callouts = MG2D overlay beats anchored to 3D objects.
import * as THREE from "three";
import { buildWorld, MY_O, GW_O, zN, zS } from "./malacca-world.js";

r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const outC = document.createElement("canvas"); outC.width = W; outC.height = H; document.body.appendChild(outC); const octx = outC.getContext("2d");
r.domElement.style.display = "none"; document.body.appendChild(r.domElement);
const c2 = document.createElement("canvas"); c2.width = W; c2.height = H; const x2 = c2.getContext("2d");
const c3 = document.createElement("canvas"); c3.width = W; c3.height = H; const x3 = c3.getContext("2d");
const SKY = new THREE.Color(0xdfe4e8);

// invisible measuring volumes for the gate (a "place" is a subject too): the narrows and the strait
const ghost = (w, h, d, x, y, z, g) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })); m.position.set(x, y, z); g.add(m); return m; };
const NARROWS = ghost(26, 2, 70, 0, 1, 0, REG.strait), STRAIT = ghost(260, 2, 100, -40, 1, 0, REG.strait);

const mk = d => new ShaderPass({ uniforms: { tDiffuse: { value: null }, dir: { value: d }, res: { value: new THREE.Vector2(W, H) }, fy: { value: 0.5 }, amt: { value: 4 }, b0: { value: 0.1 }, b1: { value: 0.42 } },
  vertexShader: `varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,

// ================= script -> beats =================
const BOARDS = { flows: ["oil", "chips", "food", "cars", "chinaOil"], closers: ["navy", "pirates", "accident", "suez", "queue", "money"],
  gaps: ["pipe", "war", "tankerIn", "gwadar", "canal"], closure: ["insurance", "factory", "neighbours", "reserve"] };
const CARD = { oil: ["Oil, ≈23 M bbl/day", "oil"], share: ["⅕–¼ of sea trade", "globe", { share: 0.22 }], chips: ["Chips", "chip"], food: ["Food", "food"], cars: ["Cars, ore, goods", "goods"],
  chinaOil: ["China's oil imports", "barrels"], navy: ["A navy", "navy"], pirates: ["Pirates", "skiff"], accident: ["An accident", "collision"], suez: ["Suez, 2021", "canal"],
  queue: ["≈369 ships", "grid", { n: 369 }], money: ["≈$9.6 bn / day", "money"], pipe: ["Pipe: ≈4% of imports", "gauge"], war: ["Civil war", "conflict"], tankerIn: ["Still by sea", "tankerRoute"],
  gwadar: ["A quiet port", "quietPort"], canal: ["Still a drawing", "blueprint"], arctic: ["Open ≈4 months", "ice"], insurance: ["Insurance, freight", "insurance"], factory: ["Factories wait", "factory"],
  neighbours: ["Not only China", "neighbours"], reserve: ["≈100 days of stock", "tanks"] };
const KEYC = { flows: "chinaOil", closers: "suez", gaps: "pipe", closure: "reserve" };
const TLE = { 2003: ["“Malacca Dilemma”", "podium"], 2013: ["Gas pipeline, Myanmar", "pipeGas"], 2015: ["Corridor, Pakistan", "corridor"], 2017: ["Oil pipeline, Myanmar", "pipeOil"], 2021: ["Ever Given, Suez", "canal"], 2024: ["Arctic record", "ice"] };
const WORLD3 = { queue: "strait", tanker: "strait", narrows: "strait", strait: "strait", port: "strait", patrol: "strait", stuck: "strait", landfall: "myanmar", pipeline: "myanmar", gwadar: "gwadar" };
function classify(s) { if (s.startsWith("card:")) { const id = s.slice(5); const b = Object.keys(BOARDS).find(k => BOARDS[k].includes(id)); if (!b) throw new Error("card not on a board: " + s); return { kind: "2d", group: "board:" + b, item: id }; }

  if (WORLD3[s]) return { kind: "3d", region: WORLD3[s] }; throw new Error("no beat for subject " + s); }
const occ = {}; LINES.forEach(l => { l.subj = l.shows[0]; l.c = classify(l.subj); l.k = occ[l.subj] = (occ[l.subj] ?? -1) + 1; });
// runs: consecutive lines with the same region / 2D group; boundary just before the next line starts (inside the pause)
const RUNS0 = []; for (const l of LINES) { const key = l.c.kind === "2d" ? l.c.group : l.c.region, last = RUNS0[RUNS0.length - 1];

// ================= 2D MG modules (one per group; a group split over several runs continues where it left off) =================

  const last = runs[runs.length - 1], lastEnd = last.m0 + last.lines[last.lines.length - 1].end - last.t0, avail = acc;   // module time available
  const la = at[at.length - 1], tail = Math.max(0.3, lastEnd - la + 0.1), pull = clamp(avail - la - tail - 0.15, 0.9, 1.8), end = 0.15;   // pull-back starts after the last line (in the pause)
  let M;
  if (key === "tl") M = makeTimeline({ seed: 3, at, tail, pull, end, events: items.map(y => ({ id: y, year: y, cap: TLE[y][0], art: TLE[y][1], key: y === "2003" })) }, { W, H });
  else { const b = key.slice(6); for (let sd = 5 + b.length; sd < 80 + b.length; sd++) { M = makeBoard({ seed: sd, at, tail, pull, end, hold0: 0.6, items: items.map(id => ({ id, cap: CARD[id][0], art: CARD[id][1], p: CARD[id][2], key: id === KEYC[b] })) }, { W, H }); if (!boardFailsFor(M, key).length) break; } }   // layout re-solved until the board gate passes

  for (const [t, id, db, pan] of M.cues) { const ru = runs.find(q => t >= q.m0 && t < q.m0 + (q.t1 - q.t0)); if (ru) cuesOut.push([ru.t0 + t - ru.m0, id, db, pan]); }

// ================= camera: shot recipes per subject (look point + az/el/d; drift during the line) =================

    case "port": return S(Vv(-115, 4, -48), pick([66, 112, 88], k), pick([26, 20, 32], k), pick([82, 64, 74], k), 8, 0.9);
    case "patrol": { const w = Vv(168, 2, 0), base = Vv(170, 2, zN(170) - 6), car = wpos(WD.carrier);
      return [S(WD.patrol[1].position.clone().add(Vv(0, 2, 0)), 82, 20, 52), S(WD.patrol[0].position.clone().add(Vv(0, 2, 0)), 128, 18, 44, -8), S(w, 40, 32, 80, 8, 1.05), S(base, 110, 26, 62), S(car, 140, 24, 62, -10), S(w, 70, 24, 66, 8)][Math.min(k, 5)]; }

    case "pipeline": return [S(MY_O.clone().add(Vv(70, 5, -50)), 208, 30, 86, 8, 0.92, Vv(30, 2, -30)), S(MY_O.clone().add(Vv(130, 7, -100)), 160, 24, 70, -8), S(MY_O.clone().add(Vv(56, 4, -38)), 64, 40, 74, 8)][Math.min(k, 2)];
    case "gwadar": return S(GW_O.clone().add(Vv(22, 2, -22)), 112, 28, 98, 6, 0.95, Vv(16, 0, -50));
    case "map": { const c = MAP.center.clone().add(MAP_O); c.z += 2; return S(c, 90, 60, pick([60, 56, 62], k), 4, 0.95); }
  }
  if (s.startsWith("route:")) { const R = MAP.routes[s.slice(6)], b = R.box, c = b.getCenter(Vv()).add(MAP_O), sz = b.getSize(Vv());
    const d = Math.max(sz.x / (2 * Math.tan(32 * D2R)), sz.z / (2 * Math.tan(20 * D2R)) * 0.8) * 1.2 + 9; return S(c, pick([90, 98, 84], k), 58, d, pick([5, -5], k), 0.94); }
  if (s.startsWith("pin:")) { const p = MAP.pins[s.slice(4)].pin.position.clone().add(MAP_O); return S(p, pick([94, 86], k), 55, pick([21, 19], k), 5, 0.92); }

const spher = (S, u) => { const az = (S.az + S.daz * u) * D2R, el = S.el * D2R, d = S.d * (1 + (S.dd - 1) * u), look = S.look.clone().addScaledVector(S.dlook, u);
  return { look, pos: look.clone().add(Vv(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)).multiplyScalar(d)) }; };
// windows for world props / focus colours, from the line times (never hand-timed)
const WIN = { focus: {}, stuck: null };
for (const l of LINES) (WIN.focus[l.subj] ??= []).push([l.start, l.end]);
{ const st = LINES.filter(l => l.subj === "stuck")[0], ch8 = RUNS0.find(r => r.lines.includes(st)); const ch9 = LINES.find(l => l.n > st.n && l.subj === "tanker");
  WIN.stuck = [ch8.t0, ch9 ? RUNS0.find(r => r.lines.includes(ch9)).t0 - 0.01 : T, st.start + 0.4, st.end - 0.3]; }
for (const l of LINES) { if (!l.subj.startsWith("route:") && !l.subj.startsWith("pin:")) continue; MAP.focusWin[l.subj] ??= []; MAP.focusWin[l.subj].push([l.start, l.end]); MAP.intro(l.subj.split(":")[1], l.start + 0.15); }
for (const l of LINES) { const s = l.subj; if (s.startsWith("route:") || s.startsWith("pin:")) { const id = s.split(":")[1]; MAP.setSignWin(id, l.start - 0.2, l.end + 0.6); MAP.setSignWin(id + "2", l.start - 0.2, l.end + 0.6);
  if (id === "main") { MAP.setSignWin("gulf", l.start, l.end + 0.6); MAP.setSignWin("china", l.start, l.end + 0.6); } } }
MAP.intro("gulf", LINES.find(l => l.subj === "route:main").start); MAP.intro("china", LINES.find(l => l.subj === "route:main").start + 2.4); MAP.finalize(T);

// keys per 3D run: A_i reached shortly after the line starts, drift to B_i by its end; travel happens mostly in the pause.
// A travel that would beat the coast2 speed caps becomes a cut (dissolve) instead - solved here, never hand-placed.
const RUNS = [], DISS = [];   // RUNS = [t0, t1, region] continuous camera runs (cuts between them)
const KEYS = [];              // per continuous run: { t0, t1, region, keys: [[t, pos, look]] }

for (const ru of RUNS0) {
  if (ru.kind === "2d") { RUNS.push([ru.t0, ru.t1, "mg"]); continue; }
  let cur = null;
  const open = t => { cur = { t0: t, region: ru.key, keys: [] }; KEYS.push(cur); };
  ru.lines.forEach((l, i) => {
    const S = shot(l), A = spher(S, 0), B = spher(S, 1), tA = l.start + Math.min(0.5, (l.end - l.start) * 0.15);

      if (dist / dt > 0.55 || ang / dt > 22) { const tc = Math.max(pv[0] + 0.2, l.start - 0.45); cur.t1 = tc; open(tc); DISS.push({ t: tc, d: 0.5 }); cur.keys.push([tc, A.pos, A.look]); } }

RUNS.forEach((ru, i) => { if (i && ru[2] !== "mg" && RUNS[i - 1][2] !== "mg" && !DISS.some(d => Math.abs(d.t - ru[0]) < 0.01)) DISS.push({ t: ru[0], d: 0.5 }); });
function hermF(kt, vals) { const n = kt.length;

    const m = j => j <= 0 ? 0 : j >= n - 1 ? 0 : (vals[j + 1] - vals[j - 1]) / (kt[j + 1] - kt[j - 1]) * 0.85;

for (const k of KEYS) { const kt = k.keys.map(q => q[0]); const F = [0, 1, 2].map(j => hermF(kt, k.keys.map(q => q[1].getComponent(j)))), G = [0, 1, 2].map(j => hermF(kt, k.keys.map(q => q[2].getComponent(j))));
  k.gen = t => ({ pos: Vv(F[0](t), F[1](t), F[2](t)), look: Vv(G[0](t), G[1](t), G[2](t)) }); }

// ================= solver (suez.html): every frame checked (inside / ground / blocked), fixed by swing then lift, smoothed per run =================
const PXR = {}; for (const p of PX) (PXR[p.region] ??= []).push(p);
const ray = new THREE.Raycaster(), tmp = Vv(0, 0, 0);
const containsP = (p, pos) => { tmp.copy(pos).applyMatrix4(p.inv); return Math.abs(tmp.x) <= p.hs.x && Math.abs(tmp.y) <= p.hs.y && Math.abs(tmp.z) <= p.hs.z; };
