<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: segmented-tab-nav</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
      button {
        background: #6ea8fe;
        color: #0b0d10;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>segmented-tab-nav</h1>
    <p>
      Software mockup: sliding indicator autoplays across 4 tabs, content pane crossfades to match.
      4 tabs of uneven label length exercises the per-tab text-fit and indicator-width measurement.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./segmented-tab-nav.html",
        mountEl: document.getElementById("stage"),
        compositionId: "segmented-tab-nav",
        width: 1080,
        height: 1920,
        variables: {
          tabs: "Overview|Architecture|Pricing|Documentation",
          contents:
            "One platform for every service you run|Built on a fault-tolerant, horizontally scaled cluster|Usage-based, no surprise invoices|Guides, references, and a full API playground",
          accent: "accent-2",
          start_at: 0.4,
          switch_interval: 1.8,
          duration: 9,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
