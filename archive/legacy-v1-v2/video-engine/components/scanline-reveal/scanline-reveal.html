<!doctype html>
<!--
  scanline-reveal -- HyperFrames sub-composition (Editing / transitions)

  A reusable sweep-reveal transition wrapper: a "before" state (dim,
  desaturated placeholder statement) sits under an "after" state that is
  clipped to nothing; at `sweep_at` a bright scanline bar sweeps across
  the frame (horizontally or vertically) and the clip-path inset it
  drives progressively uncovers the "after" state behind it, exactly
  like a wipe transition with a glowing leading edge. Companion to
  camera-push-transition.html (scale/zoom punch) and
  match-cut-morph.html (shape morph) as the third reusable
  transition-effect wrapper in this category.

  The clip-path inset is driven by a single GSAP-tweened proxy value so
  the sweep position is deterministic under seek/scrub, matching
  browser-window.html's typing-proxy pattern.

  MULTI-INSTANCE PATTERN: one fixed literal id ("scanline-reveal"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="scanline-reveal"
  data-composition-duration="4.5"
  data-composition-variables='[
    { "id": "before_title", "type": "string", "role": "content", "label": "Before title", "description": "The outgoing statement, shown dim before the sweep.", "default": "Synchronous" },
    { "id": "before_subtitle", "type": "string", "role": "content", "label": "Before subtitle", "description": "Optional smaller line under the before title.", "default": "The caller blocks until the whole chain finishes." },
    { "id": "after_title", "type": "string", "role": "content", "label": "After title", "description": "The incoming statement, revealed by the sweep.", "default": "Asynchronous" },
    { "id": "after_subtitle", "type": "string", "role": "content", "label": "After subtitle", "description": "Optional smaller line under the after title.", "default": "The caller moves on and picks up the result later." },
    { "id": "direction", "type": "enum", "role": "content", "label": "Direction", "description": "Sweep direction across the frame.", "default": "horizontal", "options": [{ "value": "horizontal", "label": "Horizontal" }, { "value": "vertical", "label": "Vertical" }] },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Scanline bar color. Opt-in only; default is the fixed brand accent.", "default": "brand", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "sweep_at", "type": "number", "role": "timing", "label": "Sweep at", "description": "Seconds from mount when the scanline sweep starts.", "default": 1.4, "min": 0.3, "max": 30, "step": 0.05 },
    { "id": "sweep_duration", "type": "number", "role": "timing", "label": "Sweep duration", "description": "Seconds the sweep takes to cross the full frame.", "default": 0.6, "min": 0.2, "max": 3, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 4.5, "min": 1.5, "max": 20, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Scanline Reveal</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="scanline-reveal" data-duration="4.5" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
            overflow: hidden;
          }
          .sr-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
          }
          .sr-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.4cqmin;
            padding: 10cqmin;
          }
          .sr-before {
            filter: grayscale(0.6) brightness(0.55);
          }
          .sr-after {
            clip-path: inset(0 100% 0 0);
          }
          .sr-title {
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1.16;
            text-align: center;
          }
          .sr-subtitle {
            font-weight: 500;
            line-height: 1.3;
            text-align: center;
            color: var(--hf-muted, #9aa1ad);
          }
          .sr-rule {
            height: 0.5cqmin;
            min-height: 3px;
            width: 14cqmin;
            border-radius: 999px;
            background: var(--sr-accent, var(--hf-brand, #6ea8fe));
          }
          .sr-scanline {
            position: absolute;
            top: 0;
            left: -1%;
            width: 2%;
            height: 100%;
            background: linear-gradient(
              90deg,
              transparent 0%,
              var(--sr-accent, var(--hf-brand, #6ea8fe)) 50%,
              transparent 100%
            );
            box-shadow: 0 0 3cqmin var(--sr-accent, var(--hf-brand, #6ea8fe));
            opacity: 0;
          }
          .sr-scanline.sr-vertical {
            left: 0;
            top: -1%;
            width: 100%;
            height: 2%;
            background: linear-gradient(
              180deg,
              transparent 0%,
              var(--sr-accent, var(--hf-brand, #6ea8fe)) 50%,
              transparent 100%
            );
          }
        </style>

        <div class="sr-stage" id="sr-stage">
          <div class="sr-state sr-before" id="sr-before" data-layout-allow-overlap>
            <div class="sr-title" id="sr-before-title" data-layout-allow-overlap></div>
            <div class="sr-rule"></div>
            <div class="sr-subtitle" id="sr-before-subtitle" data-layout-allow-overlap></div>
          </div>
          <div class="sr-state sr-after" id="sr-after" data-layout-allow-overlap>
            <div class="sr-title" id="sr-after-title" data-layout-allow-overlap></div>
            <div class="sr-rule"></div>
            <div class="sr-subtitle" id="sr-after-subtitle" data-layout-allow-overlap></div>
          </div>
          <div class="sr-scanline" id="sr-scanline"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "scanline-reveal: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var SCHEMA = {
              before_title: { type: "string", default: "Synchronous", maxLength: 90 },
              before_subtitle: {
                type: "string",
                default: "The caller blocks until the whole chain finishes.",
                maxLength: 140,
              },
              after_title: { type: "string", default: "Asynchronous", maxLength: 90 },
              after_subtitle: {
                type: "string",
                default: "The caller moves on and picks up the result later.",
                maxLength: 140,
              },
              direction: { type: "enum", default: "horizontal", options: ["horizontal", "vertical"] },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              sweep_at: { type: "number", default: 1.4, min: 0.3, max: 30 },
              sweep_duration: { type: "number", default: 0.6, min: 0.2, max: 3 },
              duration: { type: "number", default: 4.5, min: 1.5, max: 20 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var stage = document.getElementById("sr-stage");
            var beforeState = document.getElementById("sr-before");
            var afterState = document.getElementById("sr-after");
            var scanline = document.getElementById("sr-scanline");
            var beforeTitleEl = document.getElementById("sr-before-title");
            var beforeSubtitleEl = document.getElementById("sr-before-subtitle");
            var afterTitleEl = document.getElementById("sr-after-title");
            var afterSubtitleEl = document.getElementById("sr-after-subtitle");

            root.style.setProperty("--sr-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");

            var isVertical = props.direction === "vertical";
            if (isVertical) {
              scanline.classList.add("sr-vertical");
              afterState.style.clipPath = "inset(100% 0 0 0)";
            }

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              var boxWidth = stage.clientWidth - stage.clientWidth * 0.2;

              [
                { el: beforeTitleEl, text: props.before_title },
                { el: afterTitleEl, text: props.after_title },
              ].forEach(function (item) {
                HFTextFit.fitOrTruncate(item.el, item.text, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 800,
                  maxWidth: boxWidth,
                  maxHeight: 7.4 * rootMin * 1.16 * 3,
                  baseSize: 7.4 * rootMin,
                  minSize: 22,
                  lineHeightRatio: 1.16,
                  maxLines: 3,
                });
              });

              [
                { el: beforeSubtitleEl, text: props.before_subtitle },
                { el: afterSubtitleEl, text: props.after_subtitle },
              ].forEach(function (item) {
                HFTextFit.fitOrTruncate(item.el, item.text, {
                  family: "Inter, ui-sans-serif, system-ui, sans-serif",
                  weight: 500,
                  maxWidth: boxWidth * 0.85,
                  maxHeight: 3.6 * rootMin * 1.3 * 2,
                  baseSize: 3.6 * rootMin,
                  minSize: 15,
                  lineHeightRatio: 1.3,
                  maxLines: 2,
                });
              });
            }

            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var sweepAt = Math.min(Math.max(props.sweep_at, 0.4), Math.max(0.4, duration - 0.6));
            var sweepDur = Math.min(props.sweep_duration, Math.max(0.2, duration - sweepAt - 0.3));

            var tl = gsap.timeline({ paused: true });

            tl.fromTo(beforeState, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.1);

            tl.fromTo(scanline, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.in" }, sweepAt);

            var proxy = { p: 0 }; // 0..100, position of the sweep across the frame
            tl.to(
              proxy,
              {
                p: 100,
                duration: sweepDur,
                ease: "power1.inOut",
                onUpdate: function () {
                  if (isVertical) {
                    scanline.style.top = proxy.p - 1 + "%";
                    afterState.style.clipPath = "inset(" + (100 - proxy.p) + "% 0 0 0)";
                  } else {
                    scanline.style.left = proxy.p - 1 + "%";
                    afterState.style.clipPath = "inset(0 " + (100 - proxy.p) + "% 0 0)";
                  }
                },
              },
              sweepAt
            );
            tl.to(scanline, { opacity: 0, duration: 0.25, ease: "power1.out" }, sweepAt + sweepDur - 0.15);
            tl.to(beforeState, { opacity: 0, duration: 0.2, ease: "power1.out" }, sweepAt + sweepDur * 0.5);

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["scanline-reveal"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
