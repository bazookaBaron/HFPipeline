<!doctype html>
<!--
  perspective-grid -- HyperFrames sub-composition (background / Foundation)

  A receding 3D-ish grid/floor plane background element -- decorative,
  atmospheric, no dynamic text. A dark sky-to-horizon gradient sits behind a
  large grid plane tilted back in 3D space (CSS perspective + rotateX) so
  its lines converge toward a horizon line, with an optional soft glow at
  that horizon. On reveal, the plane fades in and settles from a slightly
  steeper starting angle to its resting tilt -- ONE deliberate camera-settle
  move (motion-doctrine's sanctioned "causal motion"), never a continuous
  scroll/loop (which would violate the render's determinism -- no infinite
  or clock-driven animation is allowed, only a fixed, seek-safe settle).

  Unlike every other component in this library, this one has no dynamic
  text field at all, so HFTextFit is not invoked -- there is nothing here
  whose length isn't already fixed by the design.

  MULTI-INSTANCE PATTERN (see ../README.md): one fixed literal
  data-composition-id/timeline key ("perspective-grid"). Every per-instance
  difference (line density, horizon position, glow, timing, accent) is a
  declared variable resolved via lib/props.js -- never a forked file.

  Variables:
    - line_density (number, 4-24): how many grid rows are visible on the plane.
    - horizon_pct   (number, 0-100): vertical position of the horizon line.
    - glow          (boolean): whether a soft radial glow sits at the horizon.
    - reveal_at     (number, seconds): when the plane fades in and settles.
    - accent        (enum): grid line + glow color. Opt-in; default is the
                    fixed brand accent.
    - duration      (number, seconds): total instance length.

  Registers window.__timelines["perspective-grid"] under the literal key.
-->
<html
  lang="en"
  data-composition-id="perspective-grid"
  data-composition-duration="6"
  data-composition-variables='[
    { "id": "line_density", "type": "number", "role": "content", "label": "Line density", "description": "How many grid rows are visible on the plane.", "default": 14, "min": 4, "max": 24, "step": 1 },
    { "id": "horizon_pct", "type": "number", "role": "content", "label": "Horizon %", "description": "Vertical position of the horizon line, percent of frame height.", "default": 46, "min": 10, "max": 80, "step": 1 },
    { "id": "glow", "type": "boolean", "role": "content", "label": "Glow", "description": "Whether a soft radial glow sits at the horizon.", "default": true },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Reveal at", "description": "Seconds from mount when the plane fades in and settles.", "default": 0.2, "min": 0, "max": 30, "step": 0.05 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Grid line + glow color. Opt-in only; default is the fixed brand accent.", "default": "brand", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays. Read from props, never from static markup.", "default": 6, "min": 2, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Perspective Grid</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="perspective-grid" data-duration="6" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            container-type: size;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
          }
          .pg-sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(
              to bottom,
              var(--hf-bg, #0b0d10) 0%,
              color-mix(in srgb, var(--pg-accent, var(--hf-brand, #6ea8fe)) 10%, var(--hf-bg, #0b0d10)) 100%
            );
          }
          .pg-glow {
            position: absolute;
            left: 50%;
            width: 90cqw;
            height: 30cqh;
            background: radial-gradient(
              ellipse at center,
              color-mix(in srgb, var(--pg-accent, var(--hf-brand, #6ea8fe)) 45%, transparent) 0%,
              transparent 70%
            );
            transform: translate(-50%, -50%);
            opacity: 0;
          }
          .pg-perspective {
            position: absolute;
            inset: 0;
            perspective: 60cqh;
            perspective-origin: 50% var(--pg-horizon, 46%);
            overflow: hidden;
          }
          .pg-floor {
            position: absolute;
            left: -40%;
            width: 180%;
            height: 140cqh;
            top: var(--pg-horizon, 46%);
            transform-style: preserve-3d;
            transform-origin: 50% 0%;
            background-image: repeating-linear-gradient(
                to bottom,
                var(--pg-accent, var(--hf-brand, #6ea8fe)) 0,
                var(--pg-accent, var(--hf-brand, #6ea8fe)) 1px,
                transparent 1px,
                transparent var(--pg-row-gap, 6cqh)
              ),
              repeating-linear-gradient(
                to right,
                var(--pg-accent, var(--hf-brand, #6ea8fe)) 0,
                var(--pg-accent, var(--hf-brand, #6ea8fe)) 1px,
                transparent 1px,
                transparent 8cqw
              );
            opacity: 0;
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 96%);
            mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 96%);
          }
        </style>

        <div class="pg-sky"></div>
        <div class="pg-glow" id="pg-glow"></div>
        <div class="pg-perspective">
          <div class="pg-floor" id="pg-floor"></div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            // No HFTextFit needed -- this component has no dynamic text
            // (see file header). HFProps is still required for uniform
            // prop resolution.
            if (!window.HFProps) {
              console.error(
                "perspective-grid: HFProps not found on window. " +
                  "The host page must load compositions/components/lib/props.js before mounting this composition."
              );
            }

            var SCHEMA = {
              line_density: { type: "number", default: 14, min: 4, max: 24 },
              horizon_pct: { type: "number", default: 46, min: 10, max: 80 },
              glow: { type: "boolean", default: true },
              reveal_at: { type: "number", default: 0.2, min: 0, max: 30 },
              accent: {
                type: "enum",
                default: "brand",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              duration: { type: "number", default: 6, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var glow = document.getElementById("pg-glow");
            var floor = document.getElementById("pg-floor");

            root.style.setProperty("--pg-accent", "var(--hf-" + props.accent + ", var(--hf-brand, #6ea8fe))");
            root.style.setProperty("--pg-horizon", props.horizon_pct + "%");

            glow.style.top = props.horizon_pct + "%";
            glow.style.display = props.glow ? "" : "none";

            function layout() {
              var h = root.clientHeight;
              // More lines -> tighter row spacing on the floor plane. The
              // floor's own height is a fixed 140cqh regardless of density
              // (frame-filling: the plane always fills the same visual
              // volume; density only changes how many rows are drawn
              // within it).
              var floorHeightPx = h * 1.4;
              var rowGapPx = floorHeightPx / Math.max(4, props.line_density);
              root.style.setProperty("--pg-row-gap", rowGapPx + "px");
            }
            layout();

            var duration = props.duration;
            var revealAt = Math.min(props.reveal_at, Math.max(0, duration - 0.6));

            var tl = gsap.timeline({ paused: true });

            gsap.set(floor, { rotationX: 82, transformPerspective: 1200 });
            tl.to(floor, { opacity: 1, duration: 0.6, ease: "power1.out" }, revealAt);
            // One deliberate camera-settle move: starts slightly steeper
            // (82deg) and eases back to its resting tilt (72deg) -- a
            // fixed, seek-safe tween, never a continuous/looping scroll.
            tl.fromTo(
              floor,
              { rotationX: 82 },
              { rotationX: 72, duration: 1.1, ease: "power2.out" },
              revealAt
            );
            if (props.glow) {
              tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, revealAt + 0.2);
            }

            // Pad tl.duration() to the authored `duration` prop -- see
            // browser-window.html for the full rationale.
            tl.set({}, {}, duration);
            window.__timelines["perspective-grid"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
