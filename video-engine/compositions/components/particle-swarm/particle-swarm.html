<!doctype html>
<!--
  particle-swarm -- HyperFrames sub-composition (Data / metrics)

  A cloud/blob of many small dots scattered in an organic swarm shape, with
  a stat card overlaid over the lower part of the frame (a label + a big
  count-up number). Built for "many small distributed things forming a
  mass" narration beats (a botnet, distributed requests, compromised
  devices, etc).

  DETERMINISM: dot positions and reveal order come from a small seeded
  mulberry32 PRNG (seeded from the `seed` prop), never Math.random() -- the
  same seed always produces the exact same layout and stagger order, so the
  render is reproducible frame-for-frame (project hard rule, see PLAN.md
  Sec 0 / video-engine/CLAUDE.md "Key Rules" #6).

  COLOR DISCIPLINE DEVIATION (documented, matches browser-window's
  traffic-light-dot exemption pattern): every other component in this
  library defaults its opt-in `accent` enum to "brand" (chrome stays the
  one fixed hue unless a caller opts in). This component is a deliberate
  exception -- per the project brief, the swarm and its stat number ARE
  the content being visualized (not chrome around some other content), so
  `accent` here defaults to "accent" instead of "brand". It is still the
  same enum, still opt-in-overridable to any of the other rotation hues,
  so a caller distinguishing multiple particle-swarm instances on screen
  at once still works exactly like every other component.

  Dots are built ONCE via HFProps.rebuild from the resolved `dotCount`
  before the GSAP timeline captures references to each dot (same
  build-before-timeline discipline as heatmap-matrix.html/kpi-cluster.html).

  MULTI-INSTANCE PATTERN: one fixed literal id ("particle-swarm"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="particle-swarm"
  data-composition-duration="7"
  data-composition-variables='[
    { "id": "label", "type": "string", "role": "content", "label": "Label", "description": "Small uppercase label above the count.", "default": "SOURCES" },
    { "id": "count", "type": "number", "role": "content", "label": "Count", "description": "Target number the stat card counts up to.", "default": 1190024, "min": 0, "max": 999999999, "step": 1 },
    { "id": "dotCount", "type": "number", "role": "content", "label": "Dot count", "description": "How many dots to draw in the swarm.", "default": 200, "min": 20, "max": 320, "step": 1 },
    { "id": "seed", "type": "number", "role": "content", "label": "Seed", "description": "Seeds the deterministic PRNG that lays out the swarm -- the same seed always produces the same dot positions and reveal order.", "default": 7, "min": 0, "max": 999999, "step": 1 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Dot + count color. Defaults to the content accent hue (not brand) since the swarm IS the content here, not chrome -- see header comment.", "default": "accent", "options": [{ "value": "brand", "label": "Brand" }, { "value": "accent", "label": "Accent" }, { "value": "accent-2", "label": "Accent 2" }, { "value": "accent-3", "label": "Accent 3" }, { "value": "accent-4", "label": "Accent 4" }] },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Reveal at", "description": "Seconds from mount when dots start popping in.", "default": 0.4, "min": 0, "max": 30, "step": 0.05 },
    { "id": "count_at", "type": "number", "role": "timing", "label": "Count at", "description": "Seconds from mount when the stat card reveals and the number starts counting up.", "default": 1.6, "min": 0, "max": 30, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 7, "min": 2, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Particle Swarm</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="particle-swarm" data-duration="7" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .ps-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            overflow: hidden;
          }
          .ps-swarm {
            position: absolute;
            inset: 0;
          }
          .ps-dot {
            position: absolute;
            border-radius: 50%;
            background: var(--ps-accent, var(--hf-accent, #71f5a7));
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.3);
            will-change: transform, opacity;
          }
          .ps-card {
            position: absolute;
            left: 50%;
            bottom: 8cqmin;
            transform: translate(-50%, 2.4cqmin);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1cqmin;
            padding: 4cqmin 7cqmin;
            border-radius: 2.4cqmin;
            background: rgba(22, 24, 28, 0.72);
            border: 1px solid var(--hf-border, #2c2f36);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            max-width: 84cqmin;
          }
          .ps-label {
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 2.6cqmin;
            color: var(--hf-muted, #9aa1ad);
            white-space: nowrap;
          }
          .ps-count {
            font-weight: 800;
            letter-spacing: -0.01em;
            font-size: 8.6cqmin;
            color: var(--ps-accent, var(--hf-accent, #71f5a7));
            white-space: nowrap;
          }
        </style>

        <div class="ps-stage" id="ps-stage">
          <div class="ps-swarm" id="ps-swarm"></div>
          <div class="ps-card" id="ps-card">
            <div class="ps-label" id="ps-label"></div>
            <div class="ps-count" id="ps-count"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "particle-swarm: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            // Small seeded PRNG (mulberry32) -- deterministic given `seed`,
            // never Math.random(). Two independent instances are created
            // below so layout and reveal-order sequences don't interfere.
            function mulberry32(seed) {
              var s = seed >>> 0;
              return function () {
                s = (s + 0x6d2b79f5) | 0;
                var t = Math.imul(s ^ (s >>> 15), 1 | s);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
              };
            }

            var SCHEMA = {
              label: { type: "string", default: "SOURCES", maxLength: 40 },
              count: { type: "number", default: 1190024, min: 0, max: 999999999 },
              dotCount: { type: "number", default: 200, min: 20, max: 320 },
              seed: { type: "number", default: 7, min: 0, max: 999999 },
              accent: {
                type: "enum",
                default: "accent",
                options: ["brand", "accent", "accent-2", "accent-3", "accent-4"],
              },
              reveal_at: { type: "number", default: 0.4, min: 0, max: 30 },
              count_at: { type: "number", default: 1.6, min: 0, max: 30 },
              duration: { type: "number", default: 7, min: 2, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var swarm = document.getElementById("ps-swarm");
            var card = document.getElementById("ps-card");
            var labelEl = document.getElementById("ps-label");
            var countEl = document.getElementById("ps-count");

            root.style.setProperty("--ps-accent", "var(--hf-" + props.accent + ", var(--hf-accent, #71f5a7))");

            var dotCount = Math.round(props.dotCount);
            var layoutRand = mulberry32(Math.round(props.seed) + 1);

            // Organic blob outline: a base elliptical radius perturbed by a
            // few fixed-seed sine harmonics so the swarm silhouette isn't a
            // perfect ellipse. Central bias (pow < 1) keeps the cloud denser
            // in the middle, sparser toward the edges.
            var harmonics = [
              { n: 2 + Math.floor(layoutRand() * 2), amp: 0.08 + layoutRand() * 0.1, phase: layoutRand() * Math.PI * 2 },
              { n: 3 + Math.floor(layoutRand() * 2), amp: 0.05 + layoutRand() * 0.08, phase: layoutRand() * Math.PI * 2 },
              { n: 5 + Math.floor(layoutRand() * 3), amp: 0.03 + layoutRand() * 0.05, phase: layoutRand() * Math.PI * 2 },
            ];
            function wobble(angle) {
              var w = 1;
              for (var i = 0; i < harmonics.length; i++) {
                w += harmonics[i].amp * Math.sin(angle * harmonics[i].n + harmonics[i].phase);
              }
              return w;
            }

            var RX = 40; // percent, ellipse half-width
            var RY = 33; // percent, ellipse half-height (card sits below the swarm's visual center)
            var CY = 42; // percent, swarm center is above dead-center so the card has room below

            var dots = [];
            for (var i = 0; i < dotCount; i++) {
              var angle = layoutRand() * Math.PI * 2;
              var radius = Math.pow(layoutRand(), 0.65);
              var w = wobble(angle);
              var x = 50 + Math.cos(angle) * RX * radius * w;
              var y = CY + Math.sin(angle) * RY * radius * w;
              x = Math.min(97, Math.max(3, x));
              y = Math.min(78, Math.max(4, y));
              var size = 0.9 + layoutRand() * 2.1; // cqmin
              var baseOpacity = 0.45 + layoutRand() * 0.55;
              dots.push({ x: x, y: y, size: size, baseOpacity: baseOpacity });
            }

            // Deterministic shuffle of the reveal ORDER (Fisher-Yates using
            // the same seeded stream, continued -- never Math.random()) so
            // the pop-in reads as an organic swarm materializing rather
            // than a mechanical top-left-to-bottom-right sweep.
            var order = [];
            for (i = 0; i < dotCount; i++) order.push(i);
            for (i = order.length - 1; i > 0; i--) {
              var j = Math.floor(layoutRand() * (i + 1));
              var tmp = order[i];
              order[i] = order[j];
              order[j] = tmp;
            }
            var rank = new Array(dotCount);
            order.forEach(function (dotIndex, orderPos) {
              rank[dotIndex] = orderPos;
            });

            var dotEls = [];
            HFProps.rebuild(swarm, function (container) {
              dotEls = [];
              dots.forEach(function (dot) {
                var el = document.createElement("div");
                el.className = "ps-dot";
                el.style.left = dot.x + "%";
                el.style.top = dot.y + "%";
                el.style.width = dot.size + "cqmin";
                el.style.height = dot.size + "cqmin";
                container.appendChild(el);
                dotEls.push({ el: el, dot: dot });
              });
            });

            function formatNumber(n) {
              var rounded = Math.round(n);
              return String(rounded).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              HFTextFit.fitOrTruncate(labelEl, props.label, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 800,
                maxWidth: card.clientWidth * 0.92 || 300,
                maxHeight: 1000,
                baseSize: 2.6 * rootMin,
                minSize: 12,
                maxLines: 1,
              });
            }
            countEl.textContent = formatNumber(0);
            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var revealAt = Math.min(props.reveal_at, Math.max(0, duration - 1));
            var revealWindow = Math.min(2.4, Math.max(0.3, duration * 0.4));
            var countAt = Math.min(Math.max(props.count_at, revealAt), Math.max(0, duration - 0.6));
            var countDur = Math.min(1.8, Math.max(0.3, duration - countAt - 0.2));

            var tl = gsap.timeline({ paused: true });

            dotEls.forEach(function (item, idx) {
              var delay = revealAt + (rank[idx] / Math.max(1, dotCount - 1)) * revealWindow;
              tl.fromTo(
                item.el,
                { opacity: 0, scale: 0.3 },
                { opacity: item.dot.baseOpacity, scale: 1, duration: 0.5, ease: "power2.out" },
                Math.min(delay, Math.max(0, duration - 0.3))
              );
            });

            tl.fromTo(
              card,
              { opacity: 0, y: 24 },
              { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
              countAt
            );
            var proxy = { v: 0 };
            var targetCount = props.count;
            tl.to(
              proxy,
              {
                v: targetCount,
                duration: countDur,
                ease: "power2.out",
                onUpdate: function () {
                  countEl.textContent = formatNumber(proxy.v);
                },
              },
              countAt + 0.15
            );

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["particle-swarm"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
