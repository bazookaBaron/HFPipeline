<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: kpi-cluster</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>kpi-cluster</h1>
    <p>
      A 4-card instance (smallest frame-filling tier), proving the JSON-array-of-objects list
      prop, per-card count-up, mixed up/down/flat trend glyphs, and each card's automatic
      accent/accent-2/accent-3/accent-4 color rotation by index.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./kpi-cluster.html",
        mountEl: document.getElementById("stage"),
        compositionId: "kpi-cluster",
        width: 1080,
        height: 1920,
        variables: {
          kpis: [
            { label: "Requests / sec", value: 8420, suffix: "", decimals: 0, trend: "up" },
            { label: "Error rate", value: 0.42, suffix: "%", decimals: 2, trend: "down" },
            { label: "Avg latency", value: 118, suffix: "ms", decimals: 0, trend: "flat" },
            { label: "Active pods", value: 24, suffix: "", decimals: 0, trend: "up" },
          ],
          title: "Traffic after the rollout",
          title_reveal_at: 0,
          reveal_at: 0.3,
          card_stagger: 0.2,
          count_duration: 1,
          duration: 6.5,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
