<!doctype html><html><head><meta charset="utf-8"><title>obj3d preview</title>
<style>html,body{margin:0;background:#1d2230}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from "three"; import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
const names = new URLSearchParams(location.search).get("n").split(","); const T = 360, angles = [35, 145, 270];
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(T * angles.length, T * names.length);
r.outputColorSpace = THREE.SRGBColorSpace; r.setScissorTest(true); document.body.appendChild(r.domElement);
const cols = [0xd9a066, 0xc8c2b8, 0x7fb3c8];
const info = {};
for (const [i, n] of names.entries()) {
  const g = await new GLTFLoader().loadAsync(`out/${n}.glb`); const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1d2230);
  let tris = 0;
  g.scene.traverse(o => { if (o.isMesh) { let geo = mergeVertices(o.geometry.index ? o.geometry : o.geometry); geo.computeVertexNormals(); o.geometry = geo;
    tris += (geo.index ? geo.index.count : geo.attributes.position.count) / 3;
    o.material = new THREE.MeshStandardMaterial({ color: cols[i % 3], roughness: 0.8, flatShading: false }); } });
  const bb = new THREE.Box3().setFromObject(g.scene); const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3()).length();
  g.scene.position.sub(c); sc.add(g.scene);
  sc.add(new THREE.HemisphereLight(0xdde8ff, 0x302820, 1.4)); const k = new THREE.DirectionalLight(0xffffff, 2.2); k.position.set(2, 3, 2); sc.add(k);
  const rim = new THREE.DirectionalLight(0x99ccff, 1.2); rim.position.set(-2, 1, -3); sc.add(rim);
  info[n] = { tris: Math.round(tris), size: bb.getSize(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)) };
  for (const [j, a] of angles.entries()) {
    const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100); const rad = THREE.MathUtils.degToRad(a);
    cam.position.set(Math.sin(rad) * s * 1.7, s * 0.45, Math.cos(rad) * s * 1.7); cam.lookAt(0, 0, 0);
    const y = (names.length - 1 - i) * T; r.setViewport(j * T, y, T, T); r.setScissor(j * T, y, T, T); r.render(sc, cam);
  }
}
window.__info = info; window.__ready = true;
</script></body></html>
