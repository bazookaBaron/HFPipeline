<!doctype html>
<!--
  world-map-panel -- HyperFrames sub-composition (Data / metrics)

  A simplified, stylized world map: a graticule grid backdrop plus
  soft continent-silhouette blobs (deliberately abstract, not a precise
  atlas outline -- reads as "a world map" without a huge embedded SVG
  path payload), with N highlighted points positioned by x/y percent
  coordinates (e.g. server locations) that pulse in one at a time with
  a label, as if narration is naming each one in turn.

  Points are distinguished by rotating through --hf-accent, -2, -3, -4,
  then --hf-brand by index (added in the aesthetic-plan pass; was previously
  a single resolved accent color shared uniformly, sequence/position doing
  the differentiating). Real user feedback ("use more colors... more
  different colors") drove giving each simultaneous marker its own color --
  exactly the sanctioned per-item use case the tokens exist for (see
  ../README.md "Color discipline"). Replaces the earlier single `accent`
  prop, which is no longer meaningful once every point has its own color --
  removed from this component's schema entirely rather than left as a
  vestigial no-op.

  MULTI-INSTANCE PATTERN: one fixed literal id ("world-map-panel"); every
  per-instance difference arrives via data-composition-variables +
  data-variable-values on the host clip. See ../README.md.
-->
<html
  lang="en"
  data-composition-id="world-map-panel"
  data-composition-duration="8"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "Heading above the map.", "default": "Global edge network" },
    { "id": "points", "type": "string", "role": "content", "label": "Points", "description": "JSON array of {label, x, y} objects, x/y are percent (0-100) positions on the map, 2-8 items.", "default": "[{\"label\":\"Virginia\",\"x\":28,\"y\":38},{\"label\":\"London\",\"x\":47,\"y\":30},{\"label\":\"Frankfurt\",\"x\":58,\"y\":40},{\"label\":\"Singapore\",\"x\":78,\"y\":58},{\"label\":\"Sydney\",\"x\":86,\"y\":78},{\"label\":\"Tokyo\",\"x\":83,\"y\":38}]" },
    { "id": "reveal_at", "type": "number", "role": "timing", "label": "Reveal at", "description": "Seconds from mount when the map and title appear.", "default": 0.3, "min": 0, "max": 30, "step": 0.05 },
    { "id": "point_stagger", "type": "number", "role": "timing", "label": "Point stagger", "description": "Seconds between successive point reveals.", "default": 0.4, "min": 0.1, "max": 2, "step": 0.05 },
    { "id": "duration", "type": "number", "role": "timing", "label": "Duration", "description": "Total seconds this instance plays.", "default": 8, "min": 3, "max": 30, "step": 0.1 }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>World Map Panel</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="world-map-panel" data-duration="8" data-fps="30">
        <style>
          *,
          *::before,
          *::after {
            box-sizing: border-box;
          }
          #root {
            position: absolute;
            inset: 0;
            container-type: size;
            font-family: var(--hf-font-body, Inter, ui-sans-serif, system-ui, sans-serif);
            color: var(--hf-fg, #f4f5f7);
          }
          .wm-stage {
            position: absolute;
            inset: 0;
            background: var(--hf-bg-mesh, var(--hf-bg, #0b0d10));
            display: flex;
            flex-direction: column;
            gap: 3.6cqmin;
            padding: 7cqmin;
          }
          .wm-title {
            font-weight: 800;
            letter-spacing: -0.01em;
            opacity: 0;
            transform: translateY(1.4cqmin);
            white-space: nowrap;
            overflow: hidden;
            flex: 0 0 auto;
          }
          .wm-map {
            position: relative;
            flex: 1;
            min-height: 0;
            border-radius: 2.4cqmin;
            background: var(--hf-surface, #16181c);
            border: 1px solid var(--hf-border, #2c2f36);
            overflow: hidden;
            opacity: 0;
          }
          .wm-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(var(--hf-border, #2c2f36) 1px, transparent 1px),
              linear-gradient(90deg, var(--hf-border, #2c2f36) 1px, transparent 1px);
            background-size: 8.33% 12.5%;
            opacity: 0.35;
          }
          .wm-blob {
            position: absolute;
            background: var(--hf-surface-2, #1e2126);
            filter: blur(0.6cqmin);
          }
          .wm-point {
            position: absolute;
            transform: translate(-50%, -50%) scale(0);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8cqmin;
          }
          .wm-dot-wrap {
            position: relative;
            width: 2.2cqmin;
            height: 2.2cqmin;
            min-width: 9px;
            min-height: 9px;
          }
          .wm-ring {
            position: absolute;
            inset: -0.7cqmin;
            border-radius: 50%;
            border: 0.35cqmin solid var(--wm-accent, var(--hf-brand, #6ea8fe));
            opacity: 0;
          }
          .wm-dot {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--wm-accent, var(--hf-brand, #6ea8fe));
            box-shadow: 0 0 1.2cqmin var(--wm-accent, var(--hf-brand, #6ea8fe));
          }
          .wm-point-label {
            font-weight: 700;
            font-size: 2.2cqmin;
            white-space: nowrap;
            color: var(--hf-fg, #f4f5f7);
            background: rgba(11, 13, 16, 0.72);
            padding: 0.3cqmin 1cqmin;
            border-radius: 999px;
          }
          /* Two points close together in map-percent space (e.g. London +
             Frankfurt) would otherwise stack their labels on top of each
             other below the dot -- flip every point within the closeness
             threshold to render its label ABOVE the dot instead, so
             adjacent points never collide. See isClose()/flip below. */
          .wm-point-flip {
            flex-direction: column-reverse;
          }
        </style>

        <div class="wm-stage" id="wm-stage">
          <div class="wm-title" id="wm-title"></div>
          <div class="wm-map" id="wm-map">
            <div class="wm-grid"></div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            if (!window.HFTextFit || !window.HFProps) {
              console.error(
                "world-map-panel: HFTextFit/HFProps not found on window. The host " +
                  "page must load compositions/components/lib/{text-fit,props}.js first."
              );
            }

            var DEFAULT_POINTS = [
              { label: "Virginia", x: 28, y: 38 },
              { label: "London", x: 47, y: 30 },
              { label: "Frankfurt", x: 58, y: 40 },
              { label: "Singapore", x: 78, y: 58 },
              { label: "Sydney", x: 86, y: 78 },
              { label: "Tokyo", x: 83, y: 38 },
            ];

            // Approximate continent-silhouette blobs, positioned/sized as
            // percentages of the map box -- a deliberately abstract "world
            // map" stylization (rounded landmass shapes + graticule grid)
            // rather than a precise atlas path, matching this project's
            // frame-filling / deterministic-render constraints.
            var BLOBS = [
              { left: 8, top: 22, width: 20, height: 30, radius: "40% 60% 55% 45%" }, // N. America
              { left: 20, top: 55, width: 12, height: 30, radius: "50% 50% 40% 60%" }, // S. America
              { left: 44, top: 18, width: 10, height: 14, radius: "50%" }, // Europe
              { left: 44, top: 34, width: 16, height: 34, radius: "45% 55% 50% 50%" }, // Africa
              { left: 58, top: 16, width: 30, height: 34, radius: "40% 60% 50% 50%" }, // Asia
              { left: 78, top: 62, width: 14, height: 14, radius: "50%" }, // Australia
            ];

            var SCHEMA = {
              title: { type: "string", default: "Global edge network", maxLength: 80 },
              points: { type: "list", default: DEFAULT_POINTS, max: 8, delimiter: "|" },
              reveal_at: { type: "number", default: 0.3, min: 0, max: 30 },
              point_stagger: { type: "number", default: 0.4, min: 0.1, max: 2 },
              duration: { type: "number", default: 8, min: 3, max: 30 },
            };

            var vars =
              window.__hyperframes && window.__hyperframes.getVariables
                ? window.__hyperframes.getVariables()
                : {};
            var props = HFProps.resolve(vars, SCHEMA);

            var root = document.getElementById("root");
            var stage = document.getElementById("wm-stage");
            var titleEl = document.getElementById("wm-title");
            var map = document.getElementById("wm-map");

            // Per-point rotation, matching mini-legend.html/cost-breakdown.html
            // exactly -- real hex fallbacks so this still renders correctly in
            // isolation.
            var ACCENT_ROTATION = [
              "var(--hf-accent, #71f5a7)",
              "var(--hf-accent-2, #c5a3ff)",
              "var(--hf-accent-3, #ffb84d)",
              "var(--hf-accent-4, #ff6e6e)",
              "var(--hf-brand, #6ea8fe)",
            ];

            function normalizePoint(raw, i) {
              raw = raw && typeof raw === "object" ? raw : {};
              var fallback = DEFAULT_POINTS[i % DEFAULT_POINTS.length];
              var label = typeof raw.label === "string" && raw.label.trim() ? raw.label.trim() : fallback.label;
              var x = typeof raw.x === "number" && isFinite(raw.x) ? Math.min(100, Math.max(0, raw.x)) : fallback.x;
              var y = typeof raw.y === "number" && isFinite(raw.y) ? Math.min(100, Math.max(0, raw.y)) : fallback.y;
              return { label: label, x: x, y: y };
            }

            var points = props.points.slice(0, 8).map(normalizePoint);
            if (points.length < 2) {
              points = DEFAULT_POINTS.map(normalizePoint);
            }

            // Blobs are static decoration, rebuilt alongside points since
            // they share the same map container (clear/rebuild discipline
            // applies to the whole dynamic region, not just the list part).
            var pointEls = [];
            HFProps.rebuild(map, function (container) {
              var grid = document.createElement("div");
              grid.className = "wm-grid";
              container.appendChild(grid);

              BLOBS.forEach(function (b) {
                var blob = document.createElement("div");
                blob.className = "wm-blob";
                blob.style.left = b.left + "%";
                blob.style.top = b.top + "%";
                blob.style.width = b.width + "%";
                blob.style.height = b.height + "%";
                blob.style.borderRadius = b.radius;
                container.appendChild(blob);
              });

              // Percent-space closeness check (map is a fixed-aspect box, so
              // plain x/y percent distance is a good enough proxy for
              // on-screen distance): flip a point's label above the dot
              // when it lands close to any EARLIER point, so two nearby
              // markers (e.g. London/Frankfurt) never stack overlapping
              // labels below their dots.
              function isClose(a, b) {
                var dx = a.x - b.x;
                var dy = a.y - b.y;
                return Math.sqrt(dx * dx + dy * dy) < 8;
              }

              pointEls = [];
              points.forEach(function (pt, i) {
                var pointEl = document.createElement("div");
                var flip = false;
                for (var j = 0; j < i; j++) {
                  if (isClose(pt, points[j])) {
                    flip = true;
                    break;
                  }
                }
                pointEl.className = "wm-point" + (flip ? " wm-point-flip" : "");
                pointEl.style.left = pt.x + "%";
                pointEl.style.top = pt.y + "%";

                var pointColor = ACCENT_ROTATION[i % ACCENT_ROTATION.length];

                var dotWrap = document.createElement("div");
                dotWrap.className = "wm-dot-wrap";
                var ring = document.createElement("div");
                ring.className = "wm-ring";
                ring.style.borderColor = pointColor;
                var dot = document.createElement("div");
                dot.className = "wm-dot";
                dot.style.background = pointColor;
                dot.style.boxShadow = "0 0 1.2cqmin " + pointColor;
                dotWrap.appendChild(ring);
                dotWrap.appendChild(dot);

                var labelEl = document.createElement("div");
                labelEl.className = "wm-point-label";
                labelEl.textContent = pt.label;

                pointEl.appendChild(dotWrap);
                pointEl.appendChild(labelEl);
                container.appendChild(pointEl);
                pointEls.push({ el: pointEl, ring: ring, labelEl: labelEl, point: pt });
              });
            });

            function layout() {
              var rootMin = Math.min(root.clientWidth, root.clientHeight) / 100;
              var titleBoxWidth = stage.clientWidth - stage.clientWidth * 0.14;

              HFTextFit.fitOrTruncate(titleEl, props.title, {
                family: "Inter, ui-sans-serif, system-ui, sans-serif",
                weight: 800,
                maxWidth: titleBoxWidth,
                maxHeight: 1000,
                baseSize: 5.6 * rootMin,
                minSize: 18,
                maxLines: 1,
              });
            }

            layout();
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(layout);
            }

            var duration = props.duration;
            var revealAt = Math.min(props.reveal_at, Math.max(0, duration - 0.6));
            var stagger = props.point_stagger;

            var tl = gsap.timeline({ paused: true });
            tl.fromTo(titleEl, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, revealAt);
            tl.fromTo(map, { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, revealAt + 0.15);

            var pointsStart = revealAt + 0.55;
            pointEls.forEach(function (p, i) {
              var at = Math.min(pointsStart + i * stagger, Math.max(0, duration - 0.4));
              tl.to(p.el, { scale: 1, duration: 0.35, ease: "back.out(2.4)" }, at);
              tl.fromTo(p.ring, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.6, duration: 0.65, ease: "power2.out" }, at);
            });

            // Pad tl.duration() to the authored `duration` prop -- see the
            // matching comment in browser-window.html for why.
            tl.set({}, {}, duration);
            window.__timelines["world-map-panel"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
