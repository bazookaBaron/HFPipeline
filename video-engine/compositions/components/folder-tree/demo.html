<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: folder-tree</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>folder-tree</h1>
    <p>
      Software-mockup primitive: a 2-item folder stack (fewer items -> bigger cards, more
      breathing room) with per-item branch-tag pills rotating through the content-accent set
      and real text-fit on name/tag/secondary-line.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./folder-tree.html",
        mountEl: document.getElementById("stage"),
        compositionId: "folder-tree",
        width: 1080,
        height: 1920,
        variables: {
          folders: JSON.stringify([
            { name: "payments-service/", branchTag: "release/v2.4.0", secondaryLine: "node_modules/ · dist/ · coverage/" },
            { name: "shared-ui-kit/", branchTag: "feature/dark-mode", secondaryLine: "212 files · updated 8m ago" },
          ]),
          accent: "brand",
          reveal_at: 0.3,
          item_stagger: 0.4,
          duration: 6,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
