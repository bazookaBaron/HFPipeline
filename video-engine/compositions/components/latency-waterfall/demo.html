<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo: latency-waterfall</title>
    <script src="../lib/text-fit.js"></script>
    <script src="../lib/props.js"></script>
    <script src="../lib/demo-runtime.js"></script>
    <style>
      body {
        margin: 0;
        background: #05060a;
        color: #f4f5f7;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #9aa1ad;
        font-size: 13px;
        max-width: 640px;
        text-align: center;
      }
      #stage-wrap {
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h1>latency-waterfall</h1>
    <p>
      Six sequential phases revealing left-to-right, each with its own rotated accent color,
      plus a running count-up total.
    </p>
    <div id="stage-wrap">
      <div id="stage" style="transform: scale(0.42); transform-origin: top left"></div>
    </div>
    <div id="controls"></div>

    <script>
      var STAGE_SCALE = 0.42;
      var stageWrap = document.getElementById("stage-wrap");
      HFDemoRuntime.mount({
        src: "./latency-waterfall.html",
        mountEl: document.getElementById("stage"),
        compositionId: "latency-waterfall",
        width: 1080,
        height: 1920,
        variables: {
          title: "Cold cache request",
          phases: JSON.stringify([
            { label: "DNS", ms: 18 },
            { label: "Connect", ms: 42 },
            { label: "TLS", ms: 71 },
            { label: "Wait", ms: 260 },
            { label: "Download", ms: 96 },
            { label: "Render", ms: 54 },
          ]),
          reveal_at: 0.3,
          phase_duration: 0.4,
          duration: 8,
        },
      }).then(function (handle) {
        stageWrap.style.width = 1080 * STAGE_SCALE + "px";
        stageWrap.style.height = 1920 * STAGE_SCALE + "px";
        HFDemoRuntime.attachScrubber(handle, document.getElementById("controls"));
      }).catch(function (err) {
        document.getElementById("stage").textContent = String(err);
        console.error(err);
      });
    </script>
  </body>
</html>
